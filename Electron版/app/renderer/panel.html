      if(warns.length) rows+=`<details class="rxgrp"><summary><span class="sicon warn">!</span>建议完善 · ${warns.length} 项（点开核对）</summary>${warns.map(itHtml).join('')}</details>`;
      if(rest.length) rows+=`<details class="rxgrp"><summary><span class="sicon ok">✓</span>通过/提示 · ${rest.length} 项（点开查看）</summary>${rest.map(itHtml).join('')}</details>`;
      body.push(`<div class="rxs"><div class="rxh">处方合规分析${nIncompat?`<span class="rxb" style="background:#fdeceb;color:#bf3a2f;font-weight:700">⚠ 配伍禁忌 ${nIncompat} 项</span>`:''}${riskN?`<span class="rxb rxb-w">${riskN} 项需关注</span>`:''}${t.rx.stat?`<span class="rxb">识别 ${t.rx.stat.total} 药 · 命中知识库 ${t.rx.stat.hit} 药</span>`:''}</div>${rxStatHtml(t.rx.stat)}${rxBelongHtml(t.rx.belong, t.rx.stat)}${rows}</div>`);
    }
    // 中药详解（按钮弹窗；成方/散药均显示，弹窗内带剂量与医保）
    if((t.herbCards||[]).length){
      body.push(herbsEntryHtml(t.herbCards));
    }
    body.push(`<div class="foot">${escapeHtml(t.disclaimer||'')}</div>`);
    rxRuleEnsure();   // 红线阈值到位后异步重刷指标条配色（首帧按默认中性色渲染，不阻塞渲染）
    return `<div class="tcm">${tcmHeadHtml(t)}${tcmKbarHtml(t)}${body.join('')}</div>`;
  }
  // ===== 推荐参考区（审方为主、推荐为辅，置于页面下方独立容器）=====
  function tcmRecsHtml(t){
    if(!t || !(t.recs||[]).length) return '';
    const cards=t.recs.map(c=>{
      const bd = (c.by==='diag'
        ? `<span class="bdg bdg-rec">按诊断「${escapeHtml(c.diag)}」推荐 · 匹配评分 ${c.score}</span>`
        : `<span class="bdg bdg-rec">按辨证「${escapeHtml(c.syndrome)}」推荐</span>`)
        + (c.top?'<span class="bdg bdg-top">⭐ 首选</span>':'');
      return fCardHtml('rec', c.f.n, bd, '', formulaRows(c.f), c.f.k==='p');
    }).join('');
    return `<div class="tcm recs"><div class="tch"><span class="tt">推荐参考</span><span class="ts">${t.recs.length} 首 · 汤方在前</span></div>${cards}<div class="foot">${escapeHtml(t.disclaimer||'')}</div></div>`;
  }

  function renderBlocks(shown){
    const secs = maskedView ? (cur.sections||[]) : inferSections(shown);
    const host=document.getElementById('blocks');
    if(!secs.length){ host.innerHTML=blockHtml('other','文本',shown); return; }
    // 药味映射未就绪时异步加载后重渲染一次（处方块识别/置顶不依赖是否已分析）
    if(!HERB_MAP){ ensureHerbMap().then(()=>{ if(cur) renderBlocks(shown); }); }
    // 若本记录已识别/推断出方剂：命中该方药味 >=2 的内容块不再笼统标"其它"，改标方名
    const tcm=cur.tcm||{};
    let ovName=null, ovGuess=false;
    if(tcm.chosen && tcm.chosen.length) ovName=tcm.chosen[0].f.n;
    else if(tcm.guess) { ovName=tcm.guess.f.n; ovGuess=true; }
    const herbs=(tcm.herbs&&tcm.herbs.length) ? tcm.herbs.filter(Boolean) : null;
    // 内容块独立药味检测：不依赖分析结果，截图处方文本即时识别
    const herbsInText=(txt)=>{
      if(!HERB_MAP) return herbs||[];
      const hit=[];
      for(const n of Object.keys(HERB_MAP)){ if(n.length>=2 && txt.includes(n)) hit.push(HERB_MAP[n].n); }
      return [...new Set(hit)];
    };
    const blocks = secs.map((s,i)=>{
      const type=s.type||'other';
      let lbl = type==='record'?'病历文书':type==='order'?'医嘱内容':'其它';
      const content = maskedView ? s.content : String(shown||'').split(/\n{2,}/).map(c=>c.trim()).filter(Boolean)[i] || s.content;
      // 纯药量行兜底：块内全部行都是「中文药名+g/克剂量」或独立剂量行（旧记录分类误标兜底，
      // 如白花蛇舌草 12g 曾因含「舌」字被存为病历文书）→ 无论存储类型是什么都并入处方。
      // record/order 块要求每行带剂量（防「舌红苔黄腻」这类病历行被误并）；other 块允许药名行。
      const ls=String(content).split('\n').map(x=>x.trim()).filter(Boolean);
      // 剂量行：药名+g/克，可带煎法注词（先煎/后下/包煎/冲服…）；且支持一行多组「药名 剂量(煎法)」
      // 粘连（HIS 常见「砂仁 9g后下蒲黄 9g包煎醋五灵脂 6g包煎」）——旧规则整行不匹配，导致该行
      // 落在 order 类型块时整块被拒之处方框外，3 味药丢失。逐组匹配+煎法后缀，叙述行仍天然挡住（无剂量）。
      const RXFLAG='(?:先煎|久煎|后下|包煎|冲服|烊化|另煎|打碎|布包|泡服)';
      const doseLine=l=>new RegExp('^(?:[\\u3400-\\u4dbf\\u4e00-\\u9fa5·]{1,12}\\s*)?\\d{1,4}(?:\\.\\d{1,2})?\\s*(?:g|G|克)\\s*'+RXFLAG+'?\\s*(?:[\\u3400-\\u4dbf\\u4e00-\\u9fa5·]{1,12}\\s*\\d{1,4}(?:\\.\\d{1,2})?\\s*(?:g|G|克)\\s*'+RXFLAG+'?\\s*)*$').test(l);
      const nameLine=l=>/^[\u3400-\u4dbf\u4e00-\u9fa5·]{1,12}$/.test(l);
      const isHerbDoseBlock=ls.length>0 && (type==='other'
        ? (ls.every(l=>doseLine(l)||nameLine(l)) && ls.some(doseLine))
        : ls.every(doseLine));
      // 表格版式碎片块（2026-10-19「中药处方」表）：OCR 把表格逐格切块，药名/规格/用法拆成
      // 「水煎内服\n日一剂\n白芍」「中药处方\n+ 加味\n单剂用量\n序号\n柴胡」这类无剂量行碎片，
      // 旧规则要求块内含剂量行 → 全被挡在处方框外，编辑框只剩个别混入块（表现为「共 2 药」）。
      // 碎片规则：各行均为 剂量行/短中文行（允许前导 + 加减号），块内命中 ≥1 个知识库药名，
      // 且（≥2 行 或 含剂量行）→ 并入处方框；parseRxRows 对未知无剂量行天然丢弃，不产生假药味。
      const fragLine=l=>doseLine(l)||/^[+＋]?\s*[\u3400-\u4dbf\u4e00-\u9fa5·]{1,12}$/.test(l);
      // 单行块：整行恰为知识库药名（含别名）才收，防「前方加陈皮」类叙述行混入；
      // 多行块：各行碎片化 + 命中 ≥1 药名即收（2 行以上纯中文短行叙述且含药名的场景罕见）
      const isHerbFragBlock=ls.length>0 && ls.every(fragLine)
        && (ls.length===1 ? !!HERB_MAP[ls[0]] : ls.some(l=>herbsInText(l).length>0));
      let isRx=false;
      // 内容块含 ≥2 个已识别药味 → 视为处方内容：命中方名标方名，否则标「处方」，并整体置顶
      if((type==='other' && herbsInText(String(content)).length>=2) || isHerbDoseBlock || isHerbFragBlock){
        lbl = ovName ? ((ovGuess?'疑似':'方剂') + ' · ' + ovName) : '处方';
        isRx=true;
      }
      return { html: blockHtml(type, lbl, content), isRx, content };
    });
    // 处方块合并为一个可编辑框（多列 grid，每味可编辑/删除/加味），置顶 #rxBlocks；其余块留在底部 #blocks
    const rxList=blocks.filter(b=>b.isRx), otherList=blocks.filter(b=>!b.isRx);
    const rxHost=document.getElementById('rxBlocks');
    if(rxHost){
      if(rxList.length){
        const joined=rxList.map(b=>b.content).join('\n');
        if(RXE.orig!==joined){
          RXE={ orig:joined, blocks:rxList.map(b=>b.content), rows:parseRxRows(joined), dirty:false };
          rxEnsureQcRows();
        }
        rxHost.innerHTML=rxEditorFrame(rxList.length, ovName, ovGuess);
        renderRxGrid();
        rxAutoLocate();   // 打开记录即定位第一个问题药味（缺剂量/未入库/剂量异常 → 滚动+闪烁红框）
      } else { rxHost.innerHTML=''; if(RXE.orig) RXE={orig:'',blocks:[],rows:[],dirty:false}; }
      rxHost.style.display=rxList.length?'':'none';
    }
    host.innerHTML=otherList.map(b=>b.html).join('');
    host.style.display=otherList.length?'':'none';
  }
  // ===== 合并处方框（可编辑）=====
  // 编辑状态：orig=识别原文（用于重置与重复渲染时保留编辑），blocks=参与合并的原块文本（保存时定位替换）
  let RXE={ orig:'', blocks:[], rows:[], dirty:false };
  // 用法/频次/表头词（日一剂、水煎内服、单剂用量…）是列式误读残留，不是药名——
  // parseRxRows 与 rxEnsureQcRows（存量 qc 防御）共用（与 lib/tcm.js USAGE_WORD_SRC 同源）
  const RX_PSEUDO_RE=/^(?:水煎内服|水煎服|水煎|煎服|内服|口服|外用|日一剂|每日一剂|日[0-9一二两三四五]+剂|每日[0-9一二两三四五]+剂|单剂用量|单剂量|每剂用量|用量|剂量|饮片)$/;
  function rxAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  // ===== 处方「用法」：抓取值入库（rec.usage），抓不到/抓错都可在这一行改 =====
  // 取值顺序：手填值 rec.usage（医生改过就一直以它为准）→ 本次分析抓到的 tcm.usage
  function usageVal(){ return String((cur&&cur.usage)||((cur&&cur.tcm&&cur.tcm.usage)||'')); }
  function usageSrc(){
    const v=usageVal();
    if(!v) return '';
    return (cur&&cur.usageEdited)?'已手填':'自动抓取';
  }
  function rxUsageDirty(v){
    RXE.usage=String(v||'').trim();
    const b=document.getElementById('rxUsageBtn'); if(b) b.disabled=(RXE.usage===usageVal());
    const t=document.getElementById('rxUsageTip'); if(t) t.textContent='未保存';
  }
  async function rxUsageSave(){
    if(!cur) return;
    const el=document.getElementById('rxUsage'); const v=String((el&&el.value)||'').trim();
    const btn=document.getElementById('rxUsageBtn'); if(btn){ btn.disabled=true; btn.textContent='保存中…'; }
    let r; try{ r=await window.qhjf.recordSetUsage(cur.id, v); }catch(err){ r={ok:false,error:String(err&&err.message||err)}; }
    if(r&&r.ok){ cur=r.rec; const t=document.getElementById('rxUsageTip'); if(t) t.textContent=v?'已手填':'已清空'; toast(v?'用法已保存':'用法已清空'); }
    else { toast('保存失败：'+((r&&r.error)||'未知错误')); if(btn) btn.disabled=false; }
    if(btn) btn.textContent='💾 保存用法';
    renderDetail();
  }
  function parseRxRows(txt){
    // 收纳判定（逐行逐对），不再按「含标点」整行剔除——OCR 常把处方行输出成
    // 「FREE 5g , 北柴胡 12g 半枝莲 12g」「太子参 15g , 姜厚朴 12g | 当归 12g」，
    // 旧规则整行丢弃 → 漏药。叙述行靠收纳判定自然挡住（无已知药名、无多剂量对）：
    //  · 已知药名 + 剂量 → 直接收；
    //  · 已知药名无剂量 → 仅「整段恰为该药名」的独立行（竖排版式「药名⏎克数」）或多剂量行尾药收；
    //  · 未知段 + 剂量 → 仅当同行有「已知药名+剂量」或 ≥2 个剂量对（明显处方行）才收；
    //  · 多列粘连「制吴茱萸3g北柴胡12g半枝莲12g」按「中文段+剂量」分词，中药库最长匹配切分；
    //  · 纯剂量行 → 回填上一条缺剂量的药味。
    const isCjkName=s=>/^[\u3400-\u4dbf\u4e00-\u9fa5·]{1,12}$/.test(s);
    const known=n=>{ try{ return !!(HERB_MAP&&HERB_MAP[n]); }catch(e){ return false; } };
    // 用法/频次/表头词不是药名：「日一剂 12g」这类列式误读对不许落成伪药行（lib/tcm.js 同源）
    const USAGE_NAME_RE=RX_PSEUDO_RE;
    // 煎法注词：HIS 常连写「砂仁 9g后下蒲黄 9g包煎醋五灵脂 6g包煎」，后下/包煎/冲服是上一味药的
    // 煎法标注，必须先于药名切分剥离——否则会黏进药名残段（「包煎醋五灵脂」→ 假药「包煎醋」）
    // 或抢走本属于下一味药的剂量（「后下」抢走蒲黄的 9g）。
    const FLAGS=['先煎','久煎','后下','包煎','冲服','烊化','另煎','打碎','布包','泡服'];
    const FLAG_RE=new RegExp('('+FLAGS.join('|')+')','g');
    // 中文段 → 药名序列：从左最长匹配中药库；未命中逐字后移攒「未知残段」，遇命中先吐出残段
    function scanNames(seg,out){
      let res=''; let i=0;
      while(i<seg.length){
        let hit=null;
        for(let L=Math.min(12,seg.length-i);L>=2;L--){
          if(known(seg.slice(i,i+L))){ hit=seg.slice(i,i+L); break; }
        }
        if(hit){ if(res){ out.push(res); res=''; } out.push(hit); i+=hit.length; }
        else { res+=seg[i]; i++; }
      }
      if(res) out.push(res);
    }
    // 中文段切分：先剥离煎法注词（产出 {flag} 项挂给上一味药），再对剩余段做药名最长匹配
    function splitRun(run){
      const out=[]; let last=0; let m;
      FLAG_RE.lastIndex=0;
      while((m=FLAG_RE.exec(run))){
        if(m.index>last) scanNames(run.slice(last,m.index),out);
        out.push({flag:m[1]});
        last=m.index+m[1].length;
      }
      if(last<run.length) scanNames(run.slice(last),out);
      // 残段归并：① 炮制前缀（醋延胡索/酒地龙/制吴茱萸…）并入紧随药名——审方/调剂要保留炮制品名，
      // 不能丢成延胡索/地龙；② 粉/炭/霜尾缀（三七粉/地榆炭）并回前一味已知药，防「三七+粉」拆假药
      const PRE_RE=/^(?:醋|酒|盐|姜|蜜|麸|煅|炒|炙|焦|土|生|熟|鲜|制|法|胆|朱)$/;
      const merged=[];
      for(let k=0;k<out.length;k++){
        const p=out[k];
        if(typeof p!=='string'){ merged.push(p); continue; }
        const nx=(k+1<out.length)?out[k+1]:null;
        if(p.length<=2 && PRE_RE.test(p) && typeof nx==='string' && nx.length>=2 && known(nx)){
          merged.push(p+nx); k++; continue; // 炮制前缀+药名 → 醋延胡索
        }
        const prev=merged.length?merged[merged.length-1]:null;
        if(/^(?:粉|炭|霜)$/.test(p) && typeof prev==='string' && prev.length>=2 && known(prev)){
          merged[merged.length-1]=prev+p; continue; // 三七+粉 → 三七粉
        }
        merged.push(p);
      }
      return merged;
    }
    const rows=[];
    const orphans=[]; // 用法列伪药名行自带的剂量（「水煎内服 10g」「日一剂 12g」）——列式误读时是真剂量，暂存按文档序回填
    String(txt||'').split('\n').forEach((raw,lnIdx)=>{
      // 煎法括号先剥离再判句读：HIS 常见「制附子 10g（先煎） 法半夏 9g 炙甘草 10g」，
      // 整行含全角括号会被下面的叙述守卫当病历行丢掉 → 整行药味全部丢失（2026-10-20 修复）
      const line=raw.trim().replace(/[（(]\s*(先煎|久煎|后下|包煎|冲服|烊化|另煎|打碎|布包|泡服)\s*[)）]/g,' $1 ').trim();
      if(!line) return;
      // 叙述守卫（恢复）：中文句读标点是叙述行特征（「小知识：乳腺肿痛…」）；半角 , | / 是
      // OCR 的多列分隔符，不能据此整行丢弃（tesseract 常输出「太子参 15g , 姜厚朴 12g | 当归 12g」）
      if(/[，。、；：！？…“”‘’（）()【】\[\]《》]/.test(line)) return;
      // HUD 提示文本混入防线：「如 128→12g」「hq→黄芪」这类箭头文本会注入假剂量/假药名
      // （「128→12g」里的 12g 会错误绑定给前面药名），处方原文不会含箭头 → 整行丢弃
      if(/[→↔⇒]/.test(line)) return;
      // 纯剂量行：归给最近一条缺剂量的药味
      const pd=line.match(/^(\d{1,4}(?:\.\d{1,2})?)\s*(?:g|G|克)$/);
      if(pd){ for(let i=rows.length-1;i>=0;i--){ if(!rows[i].dose){ rows[i].dose=pd[1]+'g'; break; } } return; }
      const re=/([\u3400-\u4dbf\u4e00-\u9fa5·]+)|(\d{1,4}(?:\.\d{1,2})?)\s*(?:g|G|克)/g;
      let m; const pending=[];
      while((m=re.exec(line))){
        if(m[1]){
          const run=m[1];
          const parts=splitRun(run);
          parts.forEach(p=>{
            if(p && typeof p==='object'){ // 煎法注词 → 挂最近一味药（随剂量列展示，保存后引擎可复核）
              for(let i=pending.length-1;i>=0;i--){ if(pending[i].name){ (pending[i].flags=pending[i].flags||[]).push(p.flag); break; } }
              return;
            }
            pending.push({name:p,dose:'',solo:parts.length===1&&p===run});
          });
        }
        else if(pending.length){
          for(let i=pending.length-1;i>=0;i--){ if(!pending[i].dose){ pending[i].dose=m[2]+'g'; break; } } // 剂量归最近的缺剂量药名
        }
      }
      const doseCnt=pending.filter(p=>p.dose).length;
      pending.forEach(p=>{
        const fl=(p.flags&&p.flags.length)?' '+p.flags.join(' '):'';
        // 已知药名（含别名，如 北柴胡/茯苓块）：有剂量直收；无剂量仅独立整行（竖排版式）或多剂量行收
        if(known(p.name)){ if(p.dose||p.solo||doseCnt>=2) rows.push({name:p.name,dose:p.dose+fl,ln:lnIdx}); }
        // 未知段+剂量：正常处方普遍存在库外药名（或炮制变体如 醋延胡索），叙述行已被上面的句读守卫挡住；
        // 单字残段（如「粉」）不是药名，拒收；用法/频次词（日一剂/水煎内服…）也不是药名——
        // 但列式误读时它们自带真剂量（水煎内服 10g），暂存进 orphans 供列式重配对按文档序回填
        else if(p.dose&&isCjkName(p.name)&&p.name.length>=2){
          if(USAGE_NAME_RE.test(p.name)){ orphans.push({ln:lnIdx,dose:p.dose+fl}); }
          else rows.push({name:p.name,dose:p.dose+fl,ln:lnIdx});
        }
      });
    });
    // 列式排版剂量重配对（2026-10-19，与 lib/tcm.js reflowColumnarDoses 同源）：
    // AI 视觉按「列」读 HIS 处方表 → 药名列成串缺剂量、用法列「水煎内服」被误读成某一药名
    //（如「冰片」）并与剂量列交错，剂量全被伪药名抢走。签名：同一药名带剂量 ≥2 次（载体行）
    // 且 ≥3 味缺剂量 → 剂量两类来源（载体行 + orphans 用法行）按**文档序**合并后回填，载体行整行剔除。
    if(rows.length>=5){
      const cnt={},ord=[];
      rows.forEach(r=>{ if(r.dose){ if(!(r.name in cnt)){ cnt[r.name]=0; ord.push(r.name); } cnt[r.name]++; } });
      let carrier=null,maxN=1;
      ord.forEach(k=>{ if(cnt[k]>maxN){ maxN=cnt[k]; carrier=k; } });
      if(carrier){
        const doses=rows.filter(r=>r.dose&&r.name===carrier).map(r=>({ln:r.ln,dose:r.dose}))
          .concat(orphans).sort((a,b)=>a.ln-b.ln).map(x=>x.dose);
        let di=0;
        rows.forEach(r=>{ if(!r.dose&&di<doses.length){ r.dose=doses[di]; di++; } });
        for(let i=rows.length-1;i>=0;i--){ if(rows[i].name===carrier) rows.splice(i,1); }
      } else if(orphans.length>=2){
        // 无载体但 orphans ≥2（饮片 10g 型：规格列剂型词被当伪药名行，剂量全挂在 orphans）——
        // orphans 已按文档序，回填给缺剂量药味；≥3 味缺剂量才动（rows>=5 已在外层把关）
        let miss=0; rows.forEach(r=>{ if(!r.dose) miss++; });
        if(miss>=3){ let di=0; rows.forEach(r=>{ if(!r.dose&&di<orphans.length){ r.dose=orphans[di].dose; di++; } }); }
      }
    }
    return rows;
  }
  function rxEditorFrame(n, ovName, ovGuess){
    RXE.usageInit=usageVal(); // 用法输入框的初始值：保存时据此判断"是否手改过"
    const bel=(cur&&cur.tcm&&cur.tcm.rx&&cur.tcm.rx.belong)||null;
    const belTxt=bel&&bel.n?` <span class="bdg bdg-rec" style="font-weight:400">《${escapeHtml(bel.n)}》${bel.by==='name'?'方名命中':'加减'}</span>`:'';
    return `<div class="block rxedit">
      <div class="bh"><span class="lbl other">处方（可编辑）</span><span style="font-weight:400;color:var(--mut);font-size:11px;white-space:nowrap">共 ${RXE.rows.length} 药</span>${belTxt}
        <span style="margin-left:auto"><button class="rxb" title="恢复识别原文" onclick="rxUndo()">↺ 恢复</button></span></div>
      <div class="rxgrid" id="rxGrid"></div>
      <div class="rxusage">
        <span class="ulb">用法</span>
        <input id="rxUsage" class="rxu" value="${rxAttr(usageVal())}" spellcheck="false"
          placeholder="未识别到用法——可手填（如：水煎服，每日1剂，分2次温服）" oninput="rxUsageDirty(this.value)">
        <button class="rxb" id="rxUsageBtn" onclick="rxUsageSave()" disabled title="保存用法并刷新合规分析（外用豁免内服量核查）">💾 保存用法</button>
        <span id="rxUsageTip" style="font-size:10.5px;color:var(--mut)">${usageSrc()}</span>
      </div>
      <div class="rxfoot">
        <button class="rxb" onclick="rxAdd()">＋ 加药</button>
        <span id="rxDirty" style="font-size:10.5px;color:#b3861f"></span>
        <button class="rxb primary" id="rxSaveBtn" onclick="rxSave()" disabled>💾 保存并重新分析</button>
      </div>
    </div>`;
  }
  // ===== 问题药味定位：滚动到处方编辑网格中的问题行并闪烁高亮（qc 提示条点药味名 / 打开记录自动定位） =====
  // add=true（显式点击）：网格中找不到该药（如药行未落到处方块）→ 自动补一行（带药名、剂量留空）并聚焦剂量框，
  // 让「缺剂量」问题总有点击可修正的入口；自动定位（rxAutoLocate）不传 add，绝不擅自改处方。
  function rxLocate(name, focus, add){
    const g=document.getElementById('rxGrid'); if(!g) return;
    const rows=[...g.querySelectorAll('.rxrow')];
    const nm=String(name||'').trim();
    let row=nm?rows.find(r=>{const i=r.querySelector('.rxn');return i&&String(i.value||'').trim()===nm;}):null;
    if(!row&&nm) row=rows.find(r=>{const i=r.querySelector('.rxn');const v=String((i&&i.value)||'').trim();
      return v&&(v.includes(nm)||nm.includes(v));});
    if(!row&&add&&nm){
      // 网格中没有该药 → 一键补录：新增一行（药名带入、剂量空），滚动定位并聚焦剂量框
      RXE.rows.push({name:nm,dose:''}); RXE.dirty=true;
      const dd=document.getElementById('rxDirty'); if(dd) dd.textContent='未保存更改';
      renderRxGrid();
      row=[...g.querySelectorAll('.rxrow')].find(r=>{const i=r.querySelector('.rxn');return i&&String(i.value||'').trim()===nm;});
      row&&row.scrollIntoView({block:'center',behavior:'smooth'});
      const dInp=row&&row.querySelector('.rxd');
      if(dInp) setTimeout(()=>{try{dInp.focus();}catch(e){}},380);
      toast('已在处方中补录「'+nm+'」，请填写剂量后保存并重新分析');
      return;
    }
    // 编辑网格中已找不到（如改名后）→ 退回第一个红框行
    if(!row) row=g.querySelector('.rxrow.bad');
    if(!row) return;
    row.scrollIntoView({block:'center',behavior:'smooth'});
    row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
    const dInp=row.querySelector('.rxd');
    // 显式点击 → 缺剂量/剂量为空时直接聚焦剂量框，点一次即可补录
    if(focus&&dInp&&!String(dInp.value||'').trim()) setTimeout(()=>{try{dInp.focus();}catch(e){}},380);
  }
  let RX_LOCATED='';   // 已自动定位过的记录 id（每条只自动定位一次，避免重复打扰）
  // 质检问题药味兜底补录：qc 检出但处方块里没有的药味（无剂量行进不了处方块、或原文该行被
  // 归入病历/医嘱块）→ 自动追加到网格尾部（标「补」，剂量空待填）。这样打开记录就能直接
  // 补剂量+保存，而不是拦截条报了药、处方栏却找不到。不算用户修改（不置 dirty）。
  function rxEnsureQcRows(){
    const qcs=((cur&&cur.qc&&cur.qc.items)||[]);
    for(const it of qcs){
      const nm=String((it&&it.name)||'').trim();
      if(!nm) continue;
      // 用法/表头伪药名（日一剂、水煎内服…）：存量记录 qc 可能带着旧规则产物，不补录进网格
      if(RX_PSEUDO_RE.test(nm)) continue;
      const inGrid=RXE.rows.some(r=>{ const v=String(r.name||'').trim();
        return v&&(v===nm||v.includes(nm)||nm.includes(v)); });
      if(!inGrid) RXE.rows.push({name:nm,dose:'',added:true});
    }
  }
  function rxAutoLocate(){
    if(!cur||RXE.dirty) return;
    const items=((cur.qc&&cur.qc.items)||[]).filter(x=>x&&x.name);
    if(!items.length){ RX_LOCATED=cur.id; return; }
    if(cur.id===RX_LOCATED) return;
    RX_LOCATED=cur.id;
    requestAnimationFrame(()=>rxLocate(items[0].name,false));
  }
  function renderRxGrid(){
    const g=document.getElementById('rxGrid'); if(!g) return;
    // 识别质检标记：缺剂量/未入库/剂量异常的药味行红框（与「处方中药」速览红框同源 cur.qc.items）
    const qcm={};
    ((cur&&cur.qc&&cur.qc.items)||[]).forEach(it=>{ if(it&&it.name) qcm[it.name]=it; });
    const badOf=n=>{ if(!n) return null; if(qcm[n]) return qcm[n];
      for(const k in qcm){ if(k&&(n.includes(k)||k.includes(n))) return qcm[k]; } return null; };
    // 库比对：识别名与库规范名不同（别名/纠错替换）→ 橙色虚线「校」标（非红框、不拦截）
    const subMap={};
    ((cur&&cur.qc&&cur.qc.subs)||[]).forEach(s=>{ if(s&&s.raw&&s.canon) subMap[s.raw]=s.canon; });
    const subOf=n=>{ if(!n) return null; if(subMap[n]) return subMap[n];
      for(const k in subMap){ if(k&&(n.includes(k)||k.includes(n))) return subMap[k]; } return null; };
    g.innerHTML = RXE.rows.length ? RXE.rows.map((r,i)=>{
      const nm=String(r.name||'').trim();
      const bad=badOf(nm);
      const sub=!bad?subOf(nm):null;
      const tip=bad?` title="待修正：${rxAttr(bad.issues.map(x=>x.label).join('、'))}"`
        : (sub?` title="库比对：识别名与中药库规范名不同，疑为「${rxAttr(sub)}」或按库别名匹配（已按库分析）"`
        : (r.added?` title="质检检出但识别原文处方中无此行，已自动补录（剂量待填）"`:''));
      const tag=bad?`<span class="rxbad">${rxAttr(bad.issues.map(x=>x.label).join('/'))}</span>`
        : (sub?`<span class="rxsub" title="库比对：疑为「${rxAttr(sub)}」或按库别名匹配（已按库分析）">校</span>`
        : (r.added?`<span class="rxadd" title="质检检出但识别原文处方中无此行，已自动补录（剂量待填）">补</span>`:''));
      return `<div class="rxrow${bad?' bad':(sub?' subst':'')}"${tip}>
        <input class="rxn" value="${rxAttr(r.name)}" placeholder="药名" oninput="rxSet(${i},'name',this.value)">
        <input class="rxd" value="${rxAttr(r.dose)}" placeholder="剂量" oninput="rxSet(${i},'dose',this.value)">
        ${tag}<button class="rxx" title="删除此药" onclick="rxDel(${i})">×</button>
      </div>`;}).join('')
      : '<div style="grid-column:1/-1;font-size:11px;color:var(--mut);padding:4px 0">暂无药——点「＋ 加药」添加</div>';
    const d=document.getElementById('rxDirty'); if(d) d.textContent=RXE.dirty?'未保存更改':'';
    const b=document.getElementById('rxSaveBtn'); if(b) b.disabled=!RXE.rows.length||!RXE.dirty;
  }
  // 输入时只更新状态，绝不整格重渲染——renderRxGrid() 重建 innerHTML 会销毁正在输入的
  // 输入框焦点，导致每敲一个字符就得重新点一下才能继续输入（12g 要点三次）
  function rxSet(i,k,v){ if(!RXE.rows[i]) return; RXE.rows[i][k]=String(v||'').trim(); RXE.dirty=true;
    const d=document.getElementById('rxDirty'); if(d) d.textContent='未保存更改';
    const b=document.getElementById('rxSaveBtn'); if(b) b.disabled=!RXE.rows.length; }
  function rxDel(i){ RXE.rows.splice(i,1); RXE.dirty=true; renderRxGrid(); }
  function rxAdd(){ RXE.rows.push({name:'',dose:''}); RXE.dirty=true; renderRxGrid();
    const inputs=document.querySelectorAll('#rxGrid .rxrow:last-child .rxn'); if(inputs.length) inputs[inputs.length-1].focus(); }
  function rxUndo(){ RXE.rows=parseRxRows(RXE.orig); rxEnsureQcRows(); RXE.dirty=false; renderRxGrid(); toast('已恢复识别原文'); }
  async function rxSave(){
    const rxText=RXE.rows.map(r=>((r.name||'')+' '+(r.dose||'')).trim()).filter(Boolean).join('\n');
    if(!rxText){ toast('处方内容为空'); return; }
    const btn=document.getElementById('rxSaveBtn'); if(btn){ btn.disabled=true; btn.textContent='分析中…'; }
    // 重建完整文本：首个处方块位置替换为编辑后文本，其余处方块已并入、跳过
    const shown=maskedView?cur.text:(cur.rawText||cur.text);
    let secs; try{ secs=maskedView?(cur.sections&&cur.sections.length?cur.sections:inferSections(shown)):inferSections(shown); }catch(e){ secs=[]; }
    let used=false; const parts=[];
    for(const s of secs){
      if(RXE.blocks.includes(s.content)){ if(!used){ parts.push(rxText); used=true; } }
      else parts.push(s.content);
    }
    if(!used) parts.unshift(rxText);
    // 用法随处方一起提交：只在医生改过时才传（传了即视为手填，落库后不再被抓取值覆盖）
    const usageIn=String(((document.getElementById('rxUsage')||{}).value)||'').trim();
    const usageTxt=(usageIn!==String(RXE.usageInit||'').trim())?usageIn:'';
    let r;
    try{ r=await window.qhjf.recordSetRx(cur.id, parts.join('\n'), usageTxt); }
    catch(err){ r={ok:false,error:String(err&&err.message||err)}; }
    if(r&&r.ok){ cur=r.rec; renderDetail(); refresh(); toast('处方已更新，分析结论已刷新'); }
    else { toast('保存失败：'+((r&&r.error)||'未知错误')); renderRxGrid(); }
  }

  function inferSections(text){
    // 简易分块：按空行粗分
    return String(text||'').split(/\n{2,}/).map(c=>({type:'other',content:c.trim()})).filter(s=>s.content);
  }

  function blockHtml(type,lbl,content){
    const cls = type==='record'?'record':type==='order'?'order':'other';
    return `<div class="block"><div class="bh"><span class="lbl ${cls}">${lbl}</span><span style="font-weight:400;color:var(--mut);font-size:11px">${content.length} 字符</span></div><pre>${escapeHtml(content)}</pre></div>`;
  }

  async function copyText(){
    const t = maskedView ? cur.text : (cur.rawText||cur.text);
    const done=()=>toast('已复制 '+t.length+' 字符');
    try{ const ok=await window.qhjf.clipboardWrite(t); if(ok){ done(); return; } }catch(e){}
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done)); }
    else fallbackCopy(t,done);
  }
  function fallbackCopy(t,done){
    const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败'); }
    document.body.removeChild(ta);
  }
  function viewImage(){ if(cur.image) window.qhjf.openImage(cur.image); }
  async function delRec(){ if(!confirm('删除该采集记录？')) return; await window.qhjf.removeRecord(cur.id); cur=null; refresh(); }
  function bindImg(){
    // 若有缩略图则展示
  }
  function toast(t){ showTip(t); }
  function showTip(msg){
    let el=document.getElementById('tipToast');
    if(!el){
      el=document.createElement('div'); el.id='tipToast';
      Object.assign(el.style,{position:'fixed',right:'24px',bottom:'20px',background:'#123f28',color:'#e6f1ea',
        padding:'9px 16px',borderRadius:'8px',fontSize:'12.5px',boxShadow:'0 4px 14px rgba(0,0,0,.25)',zIndex:'99',
        opacity:'0',transition:'opacity .2s',pointerEvents:'none',maxWidth:'60vw',wordBreak:'break-all'});
      document.body.appendChild(el);
    }
    el.textContent=msg; el.style.opacity='1';
    clearTimeout(el._t); el._t=setTimeout(()=>{ el.style.opacity='0'; }, 2200);
  }
  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

  // 采集完成/面板弹出：定位最新记录并展现
  async function locateLatest(preferId){
    await refresh();
    const target = (preferId && records.find(r=>r.id===preferId)) || records[0] || null;
    cur = target;
    renderDetail();
    renderList();
    if(target){ const el=document.querySelector('.side .rec'); if(el) el.scrollIntoView({block:'nearest'}); }
  }
  window.qhjf.onCaptureResult(d=>{
    hideCapProgress();
    if(d && d.ok){ locateLatest(d.id); if(d.dedup) toast((d.complMsg)||'已识别为重复截取：已覆盖原记录'); }
    else if(d && !d.canceled) toast('采集失败：' + ((d&&d.error)||'未知错误')); // 失败不再静默
  });
  window.qhjf.onCapProgress(p=>{
    if(!p || typeof p.pct!=='number') return;
    if(p.pct<=0){ hideCapProgress(); return; }
    // 面板可见时同步显示内嵌进度（面板被隐藏的采集流程由主进程 HUD 呈现）
    const el=document.getElementById('capProg');
    if(el && el.style.display!=='flex' && document.visibilityState==='visible') el.style.display='flex';
    setCapProgress(p.pct, p.label);
  });
  // AI 分析进度：只往「正在生成的 AI 卡」里填真实里程碑（非当前记录的进度直接忽略）
  window.qhjf.onAiProgress && window.qhjf.onAiProgress(p=>{
    if(!p || typeof p.pct!=='number') return;
    if(!aiState || aiState.status!=='busy') return;
    aiState.prog=p;
    aiProgUpdate(p);
  });
  // 面板每次弹出（悬浮球/托盘）→ 直接定位并展现最新采集记录
  window.qhjf.onPanelRefresh(()=>{ locateLatest(); });
  document.getElementById('btnKb').addEventListener('click', ()=>{ if(!kbMode) showKb(); else exitKb(); });
  window.qhjf.aiConfigGet().then(c=>{ aiCfg=c||{}; if(cur) renderAiCard(); }).catch(()=>{ aiCfg={}; });
  // 组成逐味药说明数据：就绪后若当前记录已分析则重渲染一次（让组成行升级为逐味药块）
  ensureHerbMap().then(()=>{ if(cur && isAnalyzed(cur) && !anForceWb) renderAn(); });
  ensureYbMap().then(()=>{ if(cur && isAnalyzed(cur)) renderAn(); }); // 医保映射就绪后重渲染（补徽章）
  locateLatest();

// ================= 前台登录（登录模式 = 账号密码时启用） =================
let FRONT_USER = null;
function frontApplyUser(u){
  FRONT_USER = u;
  sessionStorage.setItem('sysFrontUser', JSON.stringify(u));
  const top = document.querySelector('.top');
  let who = document.getElementById('whoEl');
  if (!who) {
    who = document.createElement('span');
    who.id = 'whoEl'; who.className = 'who';
    top.appendChild(who);
  }
  who.innerHTML = '👤 <b>' + (u.name || u.user) + '</b>' + (u.dept ? ' · ' + u.dept : '') + ' <span class="out" id="whoOut">退出</span>';
  document.getElementById('whoOut').onclick = () => { sessionStorage.removeItem('sysFrontUser'); location.reload(); };
}
function frontGateShow(){ document.getElementById('pGate').classList.add('on'); }
async function frontGateLogin(){
  const btn = document.getElementById('pGbtn'), err = document.getElementById('pGerr');
  btn.disabled = true; btn.textContent = '验证中…'; err.textContent = '';
  try {
    const r = await window.qhjf.sysLogin('front', document.getElementById('pGu').value.trim(), document.getElementById('pGp').value);
    if (r && r.ok && r.user) {
      frontApplyUser(r.user);
      document.getElementById('pGate').classList.remove('on');
    } else { err.textContent = (r && r.error) || '登录失败'; }
  } catch (e) { err.textContent = '登录异常：' + e.message; }
  btn.disabled = false; btn.textContent = '登 录';
}
(async () => {
  let cfg = null;
  try { cfg = await window.qhjf.sysGet(); } catch (e) {}
  SYS_CFG = cfg;
  if (cfg && cfg.appName) {
    document.querySelector('.top .t1').textContent = cfg.appName;
    document.getElementById('pGateName').textContent = cfg.appName;
    document.title = cfg.appName + ' · 采集记录';
  }
  if (cfg && cfg.loginMode === 'password') {
    const saved = sessionStorage.getItem('sysFrontUser');
    if (saved) { try { frontApplyUser(JSON.parse(saved)); } catch (e) { frontGateShow(); } }
    else frontGateShow();
  }
})();
document.getElementById('pGp').addEventListener('keydown', e => { if (e.key === 'Enter') frontGateLogin(); });
document.getElementById('pGbtn').addEventListener('click', frontGateLogin);

// ================= 后台链接地址（前后台分离部署） =================
function openAdminSmart(){
  const u = SYS_CFG && SYS_CFG.adminUrl;
  if (u) window.qhjf.sysOpenUrl(u);   // 独立部署：浏览器打开后台服务
  else window.qhjf.openAdmin();       // 默认：本机后台窗口
}
function openAdminCfg(){
  document.getElementById('admUrlIn').value = (SYS_CFG && SYS_CFG.adminUrl) || '';
  document.getElementById('admUrlSt').textContent = '';
  document.getElementById('admUrlDlg').style.display = 'flex';
  document.getElementById('admUrlIn').focus();
}
function admUrlClose(){ document.getElementById('admUrlDlg').style.display = 'none'; }
async function admUrlSave(v){
  const st = document.getElementById('admUrlSt');
  const val = (v === undefined) ? document.getElementById('admUrlIn').value : v;
  const r = await window.qhjf.sysSetApp({ adminUrl: String(val || '') });
  if (r && r.error) { st.textContent = r.error; return; }
  SYS_CFG = await window.qhjf.sysGet();
  admUrlClose();
}
document.getElementById('admUrlSave').addEventListener('click', () => admUrlSave());
document.getElementById('admUrlClear').addEventListener('click', () => admUrlSave(''));
document.getElementById('admUrlCancel').addEventListener('click', admUrlClose);
document.getElementById('admUrlIn').addEventListener('keydown', e => { if (e.key === 'Enter') admUrlSave(); });
</script>

<style id="darkTheme">
/* ===== 暗色主题（body.dark）：变量整体换肤 + 语义色组件定点覆盖 ===== */
body.dark{--topbar:#161e10;--ink:#d9decb;--mut:#98a58f;--line:#3a452e;--card:#212819;--deep:#cfe0c2;--amber:#d9a441;--soft:#2b3421;--bg:#141a0f;--hov:#17241c;--card2:#1b2213;--track:#2e3924;--brand1:#161e10;--brand2:#2c4a33;color-scheme:dark}
body.dark ::-webkit-scrollbar{width:9px;height:9px}
body.dark ::-webkit-scrollbar-thumb{background:#3c4830;border-radius:5px}
body.dark ::-webkit-scrollbar-track{background:transparent}
/* —— 侧栏与列表 —— */
body.dark .rec{border-bottom-color:#17241c}
body.dark .rec:hover{background:var(--hov)}
body.dark .rec .dot{background:#4a5540}
body.dark .rec .pin{color:#5a654c}
body.dark .rec .todo{color:#d9a441}
body.dark .group-h{color:#8a967c}
body.dark .tag{background:rgba(255,255,255,.06);color:#93a49a;border-color:#46523c}
body.dark .tag.window{background:rgba(40,80,130,.25);color:#8ec2f0;border-color:#2c4a66}
body.dark .tag.region{background:rgba(20,110,86,.25);color:#7fd4b8;border-color:#1d5e4a}
body.dark .tag.uia{background:rgba(153,53,86,.22);color:#e29ab8;border-color:#6e2c44}
body.dark .tag.clipboard{background:rgba(150,97,13,.22);color:#e0b555;border-color:#6e4f16}
body.dark .tag.dept{background:rgba(110,70,170,.22);color:#c9b0ee;border-color:#4d3a72}
body.dark .srch input,body.dark .srcSel,body.dark .fchip{background:var(--card2);border-color:var(--line);color:var(--ink)}
body.dark .fchip{color:var(--mut)}
body.dark .fchip.on{background:#31402a;border-color:#5a7a4a;color:#cfe0c2}
body.dark .bulkbar{background:#2b3524;border-top-color:#3f4c33;color:var(--deep)}
body.dark .bulkbar button{background:var(--card2);border-color:#4a583c;color:var(--deep)}
body.dark .bulkbar button:hover{background:#31402a}
body.dark .bulkbar button.danger{color:#e8a49c;border-color:#5e3630}
body.dark .cmenu{background:var(--card);border-color:var(--line)}
body.dark .cmenu button{color:var(--ink)}
body.dark .cmenu button:hover{background:var(--hov)}
body.dark .cmenu button.danger{color:#e8a49c}
/* body.dark .rvbar 系列随 renderer/review-bar.js 注入 */
body.dark .rec .rv.pass{background:#25402a;color:#a8dcb4}
body.dark .rec .rv.rej{background:#3a2320;color:#f0a79c}
/* —— 详情与内容块 —— */
body.dark .dhead,body.dark .db-metric,body.dark .db-card,body.dark .block,body.dark .comp,body.dark .tcm,body.dark .aic,body.dark .cmenu{box-shadow:none}
body.dark .keys .k{background:var(--card2);border-color:#4a4530}
body.dark .block .bh{background:var(--soft)}
body.dark .block pre{color:var(--ink)}
body.dark .lbl.record{background:rgba(40,80,130,.25);color:#8ec2f0}
body.dark .lbl.order{background:rgba(153,53,86,.22);color:#e29ab8}
body.dark .lbl.other{background:rgba(255,255,255,.07);color:#93a49a}
body.dark .opt-toggle{background:var(--soft)}
body.dark .opt-toggle button{color:var(--mut)}
body.dark .thumb{background:var(--card2)}
body.dark .empty{color:#7d876f}
body.dark .empty .big{color:#414c33}
/* —— 合规/审方 —— */
body.dark .comp .ch{background:#17241c}
body.dark .comp .ch .sc{background:rgba(217,164,65,.15);color:#e0b555}
body.dark :is(.comp,.rxs) .it{border-bottom-color:#17241c}
body.dark :is(.comp,.rxs) .lv.error{background:rgba(192,57,43,.18);color:#e8a49c}

body.dark :is(.comp,.rxs) .it.incompat{background:rgba(192,57,43,.12)}
body.dark :is(.comp,.rxs) .it .bd .a{color:var(--ink)}
body.dark :is(.comp,.rxs) .it .bd .d{color:var(--mut)}
body.dark :is(.comp,.rxs) .it .bd .v{color:#86bf9e}
body.dark .comp .foot,body.dark .tcm .foot{border-top-color:#17241c;color:#7d876f}
body.dark .rxs{border-top-color:#17241c}
body.dark .rxb-w{background:rgba(217,164,65,.16);color:#e0b555}
body.dark .tag-rx{background:rgba(255,255,255,.07);color:var(--mut)}
body.dark .rxedit{border-color:var(--line)}
body.dark .rxrow:focus-within{background:var(--card2);border-color:#5a7a4a}
body.dark .rxrow .rxd{color:var(--mut)}
body.dark .rxrow .rxx{color:#5a654c}
body.dark .rxrow.subst .rxn{border-color:#a97b35;background:rgba(217,164,65,.08)}
body.dark .rxrow .rxsub{color:#e0b555}
/* —— 方剂卡/组成 —— */
body.dark .fcard{border-color:var(--line)}
body.dark .fcard.rec{background:#22301c;border-color:#3e5530}
body.dark .fcard.guess{background:#2b2617;border-color:#5a4c26}
body.dark .fcard.guess .fkind{background:rgba(217,164,65,.12);color:#e0b555;border-color:#5a4c26}
body.dark .fkind{background:rgba(255,255,255,.06);color:#b8ad84;border-color:#4a4530}
body.dark .fcard.rec .fkind{background:rgba(76,154,95,.16);color:#86bf9e;border-color:#3e5530}
body.dark .bdg{background:rgba(255,255,255,.07);color:#93a49a}
body.dark .bdg-ok{background:rgba(76,154,95,.18);color:#86bf9e}
body.dark .bdg-bad{background:rgba(192,57,43,.18);color:#e8a49c}
body.dark .bdg-rec{background:rgba(217,164,65,.16);color:#e0b555}
body.dark .fctx{color:#7d876f}
body.dark .fr{color:var(--ink)}
body.dark .tcm .tch{background:#17241c}
body.dark .tcm .chip{background:rgba(255,255,255,.07);color:#93a49a}
body.dark .tcm .chip.chip-warn{background:rgba(217,164,65,.16);color:#e0b555}
/* —— 单味药 —— */
body.dark .cing .ci{background:var(--soft);border-color:#3a452e}
body.dark .cing .ci .cn{color:#cfe0c2}
body.dark .cing .ci .cd{color:#d9a441}
body.dark .cing .ci .cx{color:var(--mut)}
body.dark .cing .ci.na{background:var(--card2)}
body.dark .cing .ci.has:hover{background:#3a3520;border-color:#8a6f35}
body.dark .hcard{background:var(--card2);border-color:var(--line)}
body.dark .hcard .hr{color:var(--ink)}
body.dark .hcard .tox,body.dark .hrow .htox,body.dark .hitem .tox-b{background:rgba(192,57,43,.18);color:#e8a49c}
body.dark .hlist{background:var(--card2);border-color:var(--line)}
body.dark .hitem{background:var(--card2)}
body.dark .hitem:nth-child(even){background:#202816}
body.dark .hrow .hfx2{color:var(--mut)}
body.dark .hitem .hd{color:var(--ink);border-top-color:#17241c}
/* —— 弹窗 —— */
body.dark .hmodal{border-color:var(--line)}
body.dark .hmodal .hmh{background:#17241c;border-bottom-color:#17241c}
body.dark .hmodal .hmh .hmt{color:var(--deep)}
body.dark .hmodal .hmr{border-bottom-color:#17241c}
body.dark .hmodal .hmr .hml{color:var(--mut)}
body.dark .hmodal .hmr .hmv{color:var(--ink)}
body.dark .hmodal .hmv .htox{background:rgba(192,57,43,.18);color:#e8a49c;border-color:#5e3630}
body.dark .hmodal .hmv .hpreg{background:rgba(153,53,86,.2);color:#e29ab8;border-color:#6e2c44}
body.dark .hchip{background:rgba(255,255,255,.06);border-color:#46523c;color:#93a49a}
body.dark .hchip.ok{background:rgba(76,154,95,.18);border-color:#3e5530;color:#86bf9e}
body.dark .hchip.na{background:rgba(255,255,255,.04);border-color:#3a452e;color:#7d876f}
body.dark .hchip.bad{background:rgba(192,57,43,.16);border-color:#a34236;color:#f0a79d}
body.dark .hchip.warnb{background:rgba(217,164,65,.12);border-color:#6e4f16;color:#e0b555}
body.dark .qcbar{background:rgba(192,57,43,.14);border-color:#5e3630;color:#e8a49c}
body.dark .qcbar.warn{background:rgba(217,164,65,.1);border-color:#6e4f16;color:#e0b555}
body.dark .qcbar.forced,body.dark .qctrace{background:rgba(185,118,15,.14);border-color:#6e4f16;color:#e0b555}
body.dark .qctrace .qt{color:#e8c072}
body.dark .qctrace .qts{color:#b99a5c}
body.dark .tag.forced{background:rgba(185,118,15,.2);color:#e0b555;border-color:#6e4f16}
body.dark .yb-jia{background:rgba(76,154,95,.18);color:#86bf9e;border-color:#3e5530}
body.dark .yb-yi{background:rgba(217,164,65,.16);color:#e0b555;border-color:#6e4f16}
body.dark .yb-zf{background:rgba(192,57,43,.18);color:#e8a49c;border-color:#5e3630}
body.dark .note{background:rgba(217,164,65,.1);border-color:#6e4f16;color:#e0b555}
body.dark .note::before{color:#e0b555}
/* —— AI 解读卡 —— */
body.dark .aic{border-color:#414059}
body.dark .aic .aih{background:#24223a;border-bottom-color:#414059}
body.dark .aic .aih .tt{color:#b3a7e8}
body.dark .aic .aih .ts{color:#9a90cc}
body.dark .aic .aih button{background:var(--card2);border-color:#4c4878;color:#b3a7e8}
body.dark .aic .aih button:hover{border-color:#5b93c4;color:#bcd6ec}
body.dark .aic .ai-mode .mk{background:rgba(44,108,168,.22);color:#a9cbe8;border-color:#33567a}
body.dark .aic .ai-err{color:#e8a49c}
body.dark .aic .md p,body.dark .aic .md ul,body.dark .aic .md ol{color:var(--ink)}
body.dark .aic .md b{color:var(--deep)}
body.dark .aic .md code{background:var(--soft);color:#86bf9e}
body.dark .aic .md pre{background:var(--card2);border-color:var(--line)}
body.dark .aic .md blockquote{border-left-color:#4c4878}
body.dark .aic .md hr{border-top-color:#414059}
body.dark .aic .md .md-table th,body.dark .aic .md .md-table td{border-color:#414059}
body.dark .aic .md .md-table th{background:#2a2740;color:#b3a7e8}
body.dark .aic .md .md-table tr:nth-child(even) td{background:#20231a}
/* —— 辨证工作台 —— */
body.dark .wb{background:var(--card2);border-color:var(--line)}
body.dark .wb .wbh{background:#17241c;border-bottom-color:var(--line)}
body.dark .wb .wbrow{border-bottom-color:#17241c}
body.dark .wb input[list]{background:var(--card2);border-color:#4a583c;color:var(--ink)}
body.dark .wb .wbhint{background:rgba(217,164,65,.14);color:#e0b555}
body.dark .wb .wbc{background:rgba(217,164,65,.1);border-color:#6e4f16;color:#e0b555}
body.dark .wb .wbc:hover{background:rgba(217,164,65,.22)}
body.dark .wbwest .wbwest-hint{background:rgba(40,80,130,.22);color:#8ec2f0;border-color:#2c4a66}
body.dark .wbwest .wbc{background:rgba(40,80,130,.16);border-color:#2c4a66;color:#8ec2f0}
/* —— 审方印章（暗色下取消正片叠底改亮色） —— */
body.dark .seal{mix-blend-mode:normal;opacity:.95;filter:none}
body.dark .seal-ok{color:#7fc98a}
body.dark .seal-warn{color:#e0b555}
body.dark .seal-bad{color:#e88a7f}
body.dark .seal-idle{color:#9aa88f}
/* —— 登录门 —— */
body.dark #pGate{background:linear-gradient(160deg,#171d10,#1e2515 60%,#141a0c)}
body.dark #pGate .gsub{color:var(--mut)}
body.dark #pGate .gcard{background:var(--card);border-color:var(--line)}
body.dark #pGate .frow input{background:var(--card2);border-color:var(--line);color:var(--ink)}
body.dark #pGate .gbtn{background:var(--green)}
body.dark #pGate .gbtn:hover{background:#3f7a4e}
/* —— 采集进度覆盖层（内联亮色需 !important 压制） —— */
body.dark #capProgLabel{color:var(--ink)!important}
body.dark #capProgPct{color:#86bf9e!important}
body.dark #capProg div[style*="e7ecdb"]{background:#2e3924!important}
/* —— 知识检索（注入样式为亮色，整域反色近似暗色） —— */
body.dark #kbHost{filter:invert(.92) hue-rotate(180deg)}
body.dark #kbHost img{filter:invert(.92) hue-rotate(180deg)}
body.dark .kbs.hmodal-mask{filter:invert(.92) hue-rotate(180deg)}

<style id="flatTheme">
/* ===== 扁平主题（body.flat）：红蓝双色 · 无渐变 · 简洁大气 ===== */
body.flat{--topbar:#2563eb;--ink:#1f2937;--mut:#64748b;--line:#e3e9f2;--card:#fff;--green:#2563eb;--deep:#154a94;--amber:#b45309;--soft:#eff5fe;--bg:#f4f6fa;--brand1:#2563eb;--brand2:#2563eb;--hov:#f1f5fb;--card2:#fff;--track:#e8edf4;color-scheme:light}

/* 顶栏 / 采集卡：品牌渐变 → 纯色蓝（--brand1==--brand2 已自动拉平，此处兜底） */
body.flat .top{background:#2563eb}
body.flat .cap{background:#2563eb}
/* 主采集按钮：金 → 白底蓝字（扁平） */

body.flat .cap .capb.main:hover{background:#eff5fe}
/* 操作按钮：渐变 → 纯色（蓝=本地 / 红=AI） */

body.flat .wb .wb-ai{background:#bf3a2f}
/* 卡片头 / 工作台：暖色渐变 → 冷灰白 */
body.flat .comp .ch{background:#f7fafc}
body.flat .tcm .tch{background:#f7fafc}
body.flat .tcm .chip{background:#e8eef7;color:#3b5876}
body.flat .aic .aih{background:#fdf2f2;border-bottom-color:#f5dcdc}

body.flat .wb{background:#fff;border-color:#e3e9f2}
body.flat .wb .wbh{background:#f7fafc;border-bottom-color:#e3e9f2}
/* 辨证提示条：绿 → 蓝 / 缺库 → 红 */

/* 来源标签：框选绿 → 红，界面文本粉 → 石板灰（红留给框选） */

body.flat .bdg-ok{background:#eff5fe;color:#2563eb}
