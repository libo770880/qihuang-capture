<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="eWifNo89DBgsNBrN5DYEuN">
<head data-page-node-id="aA5a4id67jESZ3S9AoIMxH">
<meta charset="UTF-8" data-page-node-id="TAuM15JH6rCCBmBHGxmKG7">
<title>岐黄鉴方 · 采集记录</title>
<style>
  :root{--topbar:#123f28;--ink:#17241c;--mut:#5d7067;--line:#dce5e0;--card:#fff;--green:#1d6f4b;--deep:#123f28;--amber:#b9760f;--soft:#e7f1eb;--bg:#f4f7f5;--brand1:#123f28;--brand2:#1d6f4b;--hov:#eef4f1;--card2:#f8fbfa;--track:#e5ede9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;height:100vh;overflow:hidden}
  /* 顶栏底色走 --topbar（亮=墨绿 / 扁平=品牌蓝 / 暗=深墨绿），随主题切换；不能用 --deep
     ——暗色主题里 --deep 语义倒转为浅色文字，会把顶栏刷成浅底浅字 */
  .top{height:48px;background:var(--topbar);color:#e6f1ea;display:flex;align-items:center;padding:0 12px;gap:7px;overflow:hidden;transition:background .22s ease}
  .top .t1{font-family:KaiTi,serif;font-size:17px;letter-spacing:1px}
  .top .t2{font-size:11px;opacity:.75}
  .top .sp{flex:1}
  .top button{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:#e6f1ea;border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap;flex:none;overflow:hidden;text-overflow:ellipsis}
  .top button:hover{background:rgba(255,255,255,.24)}
  .top .who{white-space:nowrap;flex:none;overflow:hidden;text-overflow:ellipsis;max-width:190px}
  .wrap{display:flex;height:calc(100vh - 48px)}
  .side{width:220px;min-width:190px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  /* 侧栏收起把手：右缘竖条，点击或 Ctrl+B 收起/展开（状态持久化） */
  .sideh{width:13px;flex:none;background:var(--track);border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:background .12s}
  .sideh:hover{background:var(--hov)}
  .sideh .ih{font-size:11px;color:var(--mut);line-height:1;transition:transform .15s}
  .sideh:hover .ih{color:var(--deep)}
  body.sideoff .side{display:none}
  body.sideoff .sideh .ih{transform:rotate(180deg)}
  /* 快速采集卡片 */
  .cap{flex:none;padding:11px 11px 10px;background:var(--card);color:#eaf2e0}
  .cap .cap-t{font-size:12px;letter-spacing:2px;margin-bottom:9px;opacity:.85;display:flex;align-items:center;gap:6px}
  .cap .cap-t::before{content:'';width:3px;height:11px;border-radius:2px;background:#9fe3b0}
  .cap .capb{display:block;width:100%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);
    color:#e6f1ea;border-radius:8px;padding:8px 12px;font-size:12.5px;cursor:pointer;text-align:left;
    font-family:"Microsoft YaHei",sans-serif;transition:background .12s}
  .cap .capb:hover{background:rgba(255,255,255,.24)}
  .cap .capb:active{transform:scale(.99)}
  .cap .capb.main{background:#f0c164;border-color:#f0c164;color:#3c2c08;font-weight:600;margin-bottom:7px;text-align:center}
  .cap .capb.main:hover{background:#f6d17e}
  .cap .caprow{display:flex;gap:5px}
  /* 三按钮等宽等高：图标在上、文字在下，单行不换行（侧栏最窄 190px 亦不折行） */
  .cap .caprow .capb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    text-align:center;font-size:11.5px;padding:6px 1px;min-height:48px;line-height:1.15;letter-spacing:0;white-space:nowrap}
  .cap .caprow .capb .ci{font-size:14px;line-height:1;white-space:nowrap}
  .cap .caprow .capb .cl{white-space:nowrap}
  .cap .cap-h{font-size:10.5px;color:#86bf9e;margin-top:8px;line-height:1.5;opacity:.9}
  #list{flex:1;overflow-y:auto;background:var(--card)}
  .main{flex:1;overflow-y:auto;padding:24px 30px 36px;background:var(--bg)}
  .main.kbhost{padding:0;overflow:hidden;display:flex}
  #kbHost{flex:1;min-width:0;margin:10px 12px}
  .rec{padding:10px 10px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
  .rec:hover{background:var(--hov)}
  .rec.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--green)}
  .rec .rt{display:flex;align-items:center;gap:6px}
  .rec .tm{font-size:11.5px;font-weight:600;color:var(--deep);white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  /* 标签独立行：来源 + 已强制等状态标，不再与时间挤同一行（窄栏防挤压错位） */
  .rec .rtags{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:4px 0 0 20px}
  .tag{font-size:10.5px;border-radius:4px;padding:0 6px;line-height:16px;background:var(--track);color:#4d6357;border:1px solid #d3ded8;white-space:nowrap;flex:none}
  .tag.window{background:#eaf3fd;color:#1b5fae;border-color:#cbdff8}
  .tag.region{background:#e1f5ee;color:#0f6e56;border-color:#9fe1cb}
  .tag.uia{background:#fceef4;color:#a03a5e;border-color:#f7c8d5}
  .tag.clipboard{background:#fdf3e2;color:#8a5a12;border-color:#edd0a0}
  .tag.dept{background:#f2eefb;color:#5b3a91;border-color:#dcd0f0}
  .rec .src{font-size:11.5px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec .cnt{font-size:11px;color:#93a49a;margin-top:2px}
  /* ===== 左侧栏记录工作台：搜索/过滤/分组/置顶/批量 ===== */
  .stools{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:7px 8px 6px}
  .strow{display:flex;align-items:center;gap:5px}
  .strow + .strow{margin-top:5px}
  .srch{flex:1;min-width:0;position:relative}
  .srch input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:7px;background:var(--card2);padding:5px 26px 5px 25px;font-size:12px;color:var(--ink);outline:none;font-family:inherit}
  .srch input:focus{border-color:#7cc49a;background:var(--card)}
  .srch input::placeholder{color:#a8b09b}
  .srch .mag{position:absolute;left:8px;top:50%;transform:translateY(-52%);font-size:11px;color:#93a49a;pointer-events:none}
  .srch .spy{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;color:#b7bda9;border:1px solid #dde2cf;border-radius:4px;padding:0 3px;line-height:13px;pointer-events:none}
  .fchip{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--mut);border-radius:9px;font-size:11px;padding:2.5px 2px;cursor:pointer;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fchip.on{background:var(--soft);border-color:var(--green);color:var(--deep);font-weight:600}
  .fchip.fix{flex:none;padding:2.5px 8px}
  .srcSel{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--card2);color:var(--mut);font-size:11.5px;padding:3px 4px;outline:none;font-family:inherit}
  .group-h{display:flex;align-items:center;gap:7px;padding:7px 10px 4px;font-size:11px;color:#8a927e;font-weight:600}
  .group-h::after{content:'';flex:1;height:1px;background:var(--line)}
  .rec{position:relative}
  .rec .dot{flex:none;width:7px;height:7px;border-radius:50%;background:#c3d2c8}
  .rec .dot.done{background:#2f8f62}
  .rec .ck{flex:none;width:13px;height:13px;border:1.5px solid #b3c4ba;border-radius:3.5px;background:var(--card);cursor:pointer;position:relative;flex:none}
  .rec .ck:hover{border-color:var(--green)}
  .rec .ck.on{background:var(--green);border-color:var(--green)}
  .rec .ck.on::after{content:'';position:absolute;left:3px;top:0.5px;width:4px;height:7px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(42deg)}
  .rec .pin{flex:none;margin-left:auto;font-size:12.5px;color:#c3d2c8;cursor:pointer;line-height:1;padding:0 2px}
  .rec .pin:hover{color:#e0a63c}
  .rec .pin.on{color:#e0a63c}
  .rec .todo{color:#b8860b;font-weight:600}
  .bulkbar{flex:none;display:none;align-items:center;gap:6px;padding:7px 9px;background:#eef4e2;border-top:1px solid #c9e2d3;font-size:11.5px;color:var(--deep)}
  .bulkbar.on{display:flex}
  .bulkbar b{flex:1;font-weight:600;white-space:nowrap}
  .bulkbar button{border:1px solid #b7ddc6;background:var(--card);color:var(--deep);border-radius:6px;font-size:11.5px;padding:3.5px 9px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .bulkbar button:hover{background:#f3f7e9}
  .bulkbar button.danger{color:#bf3a2f;border-color:#e8c4c0}
  .bulkbar button.danger:hover{background:#fbeeee}
  .cmenu{position:fixed;z-index:300;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 22px rgba(50,60,35,.18);padding:4px;display:none;min-width:126px}
  .cmenu.show{display:block}
  .cmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;font-size:12px;color:var(--ink);border-radius:5px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .cmenu button:hover{background:var(--hov)}
  .cmenu button.danger{color:#bf3a2f}
  /* ===== 数据看板 ===== */
  .db-metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .db-metric .k{font-size:12px;color:var(--mut)}
  .db-metric .v{font-size:26px;font-weight:700;color:var(--deep);margin-top:4px;line-height:1.2}
  .db-metric .s{font-size:11px;color:#93a49a;margin-top:3px}
  .db-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .db-card .t{font-size:13px;font-weight:700;color:var(--deep)}
  .db-row{display:flex;align-items:center;gap:8px;margin-top:8px}
  .db-row .db-k{flex:none;width:88px;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .db-row .db-track{flex:1;height:12px;border-radius:6px;background:var(--track);overflow:hidden}
  .db-row .db-fill{display:block;height:100%;border-radius:6px}
  .db-row .db-v{flex:none;width:26px;text-align:right;font-size:12px;color:var(--mut)}
  .db-trend{display:flex;align-items:flex-end;gap:10px;height:112px;margin-top:12px}
  .db-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .db-col b{font-size:11.5px;color:var(--mut);font-weight:600;height:14px;line-height:14px}
  .db-col .db-bar{width:60%;max-width:34px;border-radius:5px 5px 0 0;background:var(--green)}
  .db-col i{font-style:normal;font-size:10.5px;color:#93a49a}
  .db-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  .dchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .dchips .fchip{flex:none;padding:3px 10px;border-radius:999px;font-size:11.5px}
  .db-deptrow{cursor:pointer;border-radius:6px;padding:1px 4px;margin-left:-4px;margin-right:-4px}
  .db-deptrow:hover{background:var(--hov)}
  .db-deptrow.on{background:var(--soft)}
  .db-deptrow.on .db-k{font-weight:700;color:var(--deep)}
  .db-card .t .db-tip{font-size:10.5px;font-weight:400;color:#93a49a;margin-left:6px}
  /* 详情页头（重做：页头卡片 + 居中内容列，大气简洁） */
  .dwrap{max-width:920px;margin:0 auto;position:relative}
  /* 审方印章：合规/核查结论突出显示（三态：合规通过 / 已核查·有提示 / 需复核） */
  .seal{position:absolute;top:-5px;right:16px;width:78px;height:78px;border-radius:50%;z-index:40;pointer-events:none;display:flex;align-items:center;justify-content:center;transform:rotate(-14deg);mix-blend-mode:multiply;opacity:.92;filter:drop-shadow(0 2px 3px rgba(60,70,40,.18));border:3px solid currentColor}
  .seal i{position:absolute;inset:4px;border-radius:50%;border:1.5px solid currentColor;opacity:.8}
  .seal b{font-family:KaiTi,STKaiti,serif;font-size:16px;line-height:1.18;letter-spacing:2px;text-align:center;font-weight:700;color:currentColor}
  .seal s{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:1px;text-decoration:none;font-family:Consolas,monospace;color:currentColor;opacity:.75}
  .seal-ok{color:#17734a}
  .seal-warn{color:#b8860b}
  .seal-bad{color:#c53f33}
  .seal-idle{color:#5d7067}
  .seal-rej{color:#a03028}
  /* 人工复核条样式随 renderer/review-bar.js 注入（与辨证咨询窗共用同一份，不在此处重复定义） */
  /* 侧栏记录卡的复核标记 */
  .rec .rv{font-size:10px;border-radius:5px;padding:0 5px;line-height:15px;font-weight:600;margin-left:5px}
  .rec .rv.pass{background:#e2f2e4;color:#16674a}
  .rec .rv.rej{background:#fbe4e1;color:#bf3a2f}
  .dhead{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px 12px;margin-bottom:14px;box-shadow:0 1px 4px rgba(60,70,40,.05)}
  .dhead .dt{font-size:17px;font-weight:700;color:var(--deep);font-family:KaiTi,serif;letter-spacing:.5px;line-height:1.4}
  .dhead .dm{font-size:12px;color:var(--mut);margin-top:6px;display:flex;gap:16px;flex-wrap:wrap}
  .dhead .dm b{color:var(--ink);font-weight:600}
  .dact{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
  .dact .sp{flex:1}
  .dact .ghost{background:transparent;border:1px solid var(--line);border-radius:7px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--mut)}
  .dact .ghost:hover{border-color:#7cc49a;color:var(--green)}
  .dact .ghost.danger:hover{border-color:#d8a49f;color:#bf3a2f}
  /* ===== 使用说明页（顶栏 ❔ 入口）：分节导航 + 单节内容，不堆长滚动 ===== */
  .hwrap{max-width:960px}
  .hwrap .dhead{margin-bottom:12px}
  .hwrap .dt{display:flex;align-items:center;gap:10px}
  .hq{flex:1 1 180px;min-width:140px;max-width:300px;border:1px solid var(--line);border-radius:7px;
    background:var(--card2);padding:5px 10px;font-size:12px;color:var(--ink);font-family:inherit;outline:none}
  .hq:focus{border-color:var(--green);background:var(--card)}
  .hsecs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .hsecs button{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);
    color:var(--mut);border-radius:16px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .hsecs button:hover{border-color:var(--green);color:var(--green)}
  .hsecs button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  .hsecs button .n{font-size:10px;background:rgba(127,127,127,.18);border-radius:99px;padding:0 5px;line-height:15px}
  .hsecs button.on .n{background:rgba(255,255,255,.24)}
  .hsecs button.hit{border-color:var(--amber)}
  .hcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 20px 17px;box-shadow:0 1px 4px rgba(60,70,40,.05)}
  .hcard h4{margin:0 0 3px;font-size:15px;color:var(--deep);font-family:KaiTi,serif;letter-spacing:.6px}
  .hcard .lead{font-size:12px;color:var(--mut);line-height:1.75;margin-bottom:9px}
  .hcard h5{margin:13px 0 6px;font-size:12.5px;color:var(--deep);letter-spacing:.3px}
  .htbl{width:100%;border-collapse:collapse;font-size:12px;line-height:1.6}
  .htbl th{text-align:left;font-weight:600;color:var(--mut);background:var(--card2);border:1px solid var(--line);padding:5px 9px;white-space:nowrap}
  .htbl td{border:1px solid var(--line);padding:5px 9px;color:var(--ink);vertical-align:top}
  .htbl td b{color:var(--deep)}
  .hcard code{background:var(--track);border-radius:4px;padding:0 5px;font-size:11.5px;font-family:Consolas,monospace;color:var(--deep)}
  .hsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .hstep{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card2);position:relative;overflow:hidden}
  .hstep .n{position:absolute;right:9px;top:5px;font-size:24px;font-weight:700;color:var(--track);font-family:Consolas,monospace;line-height:1}
  .hstep b{display:block;font-size:12.5px;color:var(--deep);margin-bottom:3px}
  .hstep span{font-size:11.5px;color:var(--mut);line-height:1.7}
  .hkbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--card2);
    padding:0 6px;font-size:11.5px;font-family:Consolas,monospace;color:var(--ink);white-space:nowrap}
  .hnote{border-left:3px solid var(--green);background:var(--soft);border-radius:0 8px 8px 0;padding:7px 11px;
    font-size:11.5px;color:var(--ink);line-height:1.75;margin-top:10px}
  .hnote.warn{border:1px dashed var(--line);border-left:3px solid var(--amber);background:var(--card2)}
  mark.hmark{background:#ffe9a8;color:#5b4100;border-radius:3px;padding:0 2px}
  .hfaq{border:1px solid var(--line);border-radius:8px;padding:6px 11px;margin-top:7px;background:var(--card2)}
  .hfaq summary{cursor:pointer;font-size:12px;color:var(--deep);font-weight:600;list-style:none;outline:none}
  .hfaq summary::-webkit-details-marker{display:none}
  .hfaq summary::before{content:'▸ ';color:var(--mut)}
  .hfaq[open] summary::before{content:'▾ '}
  .hfaq div{font-size:11.5px;color:var(--mut);line-height:1.85;padding:5px 0 2px 12px}
  .keys{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
  .keys .k{background:var(--card);border:1px solid #dce5e0;border-left:3px solid var(--amber);border-radius:6px;padding:4px 10px;font-size:12px}
  .keys .k b{color:var(--amber);font-weight:600;margin-right:6px}
  .keys .k .kv{cursor:pointer;border-bottom:1px dashed transparent}
  .keys .k .kv:hover{border-bottom-color:var(--amber)}
  .block{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden;background:var(--card)}
  /* 合并处方框（可编辑药味） */
  .rxedit{border-color:#d3ded8}
  .block.rxedit .bh .lbl{width:auto;padding:1px 8px;white-space:nowrap;flex:none}
  .rxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:5px 7px;padding:9px 12px}
  .rxrow{display:flex;align-items:center;gap:3px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:2px 5px}
  .rxrow:focus-within{border-color:#7cc49a;background:var(--card2)}
  .rxrow input{border:0;background:transparent;font-size:11.5px;outline:none;min-width:0;padding:2px;color:var(--deep);font-family:inherit}
  .rxrow .rxn{flex:1.4;font-weight:600}
  .rxrow .rxd{flex:1;color:#5d7067}
  .rxrow .rxx{border:0;background:transparent;color:#a8b8ae;cursor:pointer;font-size:13px;padding:0 2px;line-height:1}
  .rxrow .rxx:hover{color:#bf3a2f}
  .rxfoot{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px dashed var(--line)}
  /* 处方用法行：抓到即预填，抓不到给灰色占位提示，随时可改 */
  .rxusage{display:flex;align-items:center;gap:7px;padding:6px 12px;border-top:1px dashed var(--line)}
  .rxusage .ulb{font-size:11px;color:var(--mut);font-weight:600;white-space:nowrap}
  .rxusage .rxu{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--soft);
    font-size:11.5px;padding:4px 7px;outline:none;color:var(--deep);font-family:inherit}
  .rxusage .rxu:focus{border-color:#7cc49a;background:var(--card)}
  .rxusage .rxu::placeholder{color:#a9b8ae}

<script>
  // 主题：亮 / 扁平(红蓝) / 暗 三态循环（记忆于 localStorage，启动即应用避免闪白）
  const themeCur = () => localStorage.getItem('qhjf.theme') || 'light';
  function applyTheme(t){
    document.body.classList.toggle('dark', t==='dark');
    document.body.classList.toggle('flat', t==='flat');
    const b=document.getElementById('btnTheme');
    if(b){ b.textContent = t==='dark' ? '🌙' : (t==='flat' ? '🔷' : '☀️');
      b.title = '当前主题：'+(t==='dark'?'暗色':(t==='flat'?'扁平 · 红蓝':'亮色'))+'（点击切换）'; }
  }
  applyTheme(themeCur());
  // 主题 / 侧栏偏好：data.db 的 kv:uiprefs 是唯一存档（换机随库走），
  // localStorage 只做首绘兜底（避免闪白）。首次运行把 localStorage 的旧值写进库。
  (async function syncUiPrefs(){
    try{
      const r = await window.qhjf.uiPrefsGet();
      const p = (r && r.prefs) || {};
      if (p.theme && p.theme !== themeCur()) { try{ localStorage.setItem('qhjf.theme', p.theme); }catch(e){} applyTheme(p.theme); }
      else if (!p.theme) { try{ await window.qhjf.uiPrefsSet({ theme: themeCur() }); }catch(e){} }
      if (p.sideoff === true || p.sideoff === false) {
        document.body.classList.toggle('sideoff', !!p.sideoff);
        try{ localStorage.setItem('qhjf.sideoff', p.sideoff ? '1' : '0'); }catch(e){}
      }
    }catch(e){}
  })();
  function toggleTheme(){
    const order=['light','flat','dark'];
    const next=order[(order.indexOf(themeCur())+1)%3];
    localStorage.setItem('qhjf.theme', next);
    try{ window.qhjf.uiPrefsSet({ theme: next }); }catch(e){}
    applyTheme(next);
    toast('已切换到'+(next==='flat'?'扁平主题（红蓝）':(next==='dark'?'暗色主题':'亮色主题')));
  }
  let records=[], cur=null, maskedView=true, curDetail=null;
  let helpMode=false, helpSec='start', helpQ='';   // 使用说明页（顶栏 ❔ 入口）
  let kbMode=false, kbApi=null;

  // ===== 人工复核：共享实现见 renderer/review-bar.js（辨证咨询窗复用同一份） =====
  // 印章/列表/统计与复核条共用一套口径函数（sealCls / sealCounts / reviewOf / rvTime / isAnalyzed）
  const { sealCls, sealCounts, reviewOf, rvTime, isAnalyzed } = ReviewBar;
  ReviewBar.mount({
    get: ()=>cur,
    patch: (id,patch)=>window.qhjf.patchRecord(id,patch),
    toast,
    applied: (id,rv)=>{
      if(cur && cur.id===id) cur.review=rv;
      const i=records.findIndex(x=>x.id===id);
      if(i>=0){ const n=Object.assign({},records[i]); if(rv) n.review=rv; else delete n.review; records[i]=n; }
    },
    rerender: ()=>{ renderDetail(); renderList(); }
  });

  // ===== 知识检索页签（记录详情 ⇄ 知识检索） =====
  function setKbMode(on){
    kbMode=on;
    const b=document.getElementById('btnKb');
    if(b) b.textContent = on ? '‹ 返回记录' : '📖 知识检索';
  }
  function showKb(){
    setKbMode(true);
    const main=document.getElementById('main');
    const side=document.querySelector('.side');
    if(side) side.style.display='none';
    main.classList.add('kbhost');
    main.innerHTML='<div id="kbHost"></div>';
    const host=document.getElementById('kbHost');
    kbApi = window.KBSearch.mount(host);
  }
  function kbGoto(nm){
    showKb();
    if (kbApi && kbApi.focusSearch) kbApi.focusSearch('f', nm);
  }
  function exitKb(){
    const main=document.getElementById('main');
    const side=document.querySelector('.side');
    if(side) side.style.display='';
    main.classList.remove('kbhost');
    setKbMode(false);
    renderDetail();
  }

  // ===== 数据看板：采集/分析/合规统计总览（纯前端计算，无外部依赖） =====
  // 印章/复核条口径函数（sealCls / sealCounts / reviewOf / rvTime / isAnalyzed）统一来自
  // renderer/review-bar.js —— 与辨证咨询窗共用，避免两处各算一套。
  function isArchived(r){ const rv=reviewOf(r); return !!(rv&&rv.status==='pass'); }
  function topCounts(arr){ const m=new Map(); arr.forEach(x=>{ const k=(x||'').trim(); if(k) m.set(k,(m.get(k)||0)+1); }); return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6); }
  function dbRows(items, color){
    if(!items.length) return '<div style="color:#93a49a;font-size:12px;padding:10px 2px">暂无数据</div>';
    const max=Math.max(1,...items.map(x=>x[1]));
    return items.map(([k,v])=>`
      <div class="db-row"><span class="db-k" title="${escapeHtml(k)}">${escapeHtml(k)}</span>
      <span class="db-track"><span class="db-fill" style="width:${Math.max(4,Math.round(v*100/max))}%;background:${color}"></span></span>
      <b class="db-v">${v}</b></div>`).join('');
  }
  let dashDept='all';   // 看板科室筛选：'all' 或具体科室名（点科室分布/胶囊切换）
  function dashPickDept(d){ const v=String(d||''); dashDept=(dashDept===v)?'all':v; showDash(); }
  function deptRows(items){
    if(!items.length) return '<div style="color:#93a49a;font-size:12px;padding:10px 2px">暂无数据</div>';
    const max=Math.max(1,...items.map(x=>x[1]));
    return items.map(([k,v])=>`
      <div class="db-row db-deptrow${dashDept===k?' on':''}" data-d="${escAttr(k)}" title="点击按「${escAttr(k)}」筛选看板">
      <span class="db-k">${escapeHtml(k)}</span>
      <span class="db-track"><span class="db-fill" style="width:${Math.max(4,Math.round(v*100/max))}%;background:#6a5bb8"></span></span>
      <b class="db-v">${v}</b></div>`).join('');
  }
  function showDash(){
    setKbMode(false);
    const main=document.getElementById('main');
    const side=document.querySelector('.side');
    if(side) side.style.display='';
    main.classList.remove('kbhost');
    // 科室清单（全量记录 + 后台科室维护），胶囊用于快速筛选
    const deptSet=new Set();
    records.forEach(r=>{ const d=(r.dept||'').trim(); if(d) deptSet.add(d); });
    (((typeof SYS_CFG!=='undefined'&&SYS_CFG&&SYS_CFG.depts)||[])).forEach(d=>{ d=String(d||'').trim(); if(d) deptSet.add(d); });
    const depts=[...deptSet].sort((a,b)=>a.localeCompare(b,'zh-Hans-CN'));
    if(dashDept!=='all'&&!deptSet.has(dashDept)) dashDept='all';
    const rs=dashDept==='all'?records:records.filter(r=>(r.dept||'').trim()===dashDept);
    const total=rs.length;
    const analyzed=rs.filter(isAnalyzed).length;
    const patients=new Set(rs.map(r=>(r.patient||'').trim()).filter(Boolean)).size;
    const deptN=new Set(rs.map(r=>(r.dept||'').trim()).filter(Boolean)).size;
    const sealMap={ok:0,warn:0,bad:0,idle:0};
    rs.filter(isAnalyzed).forEach(r=>{ const c=sealCls(r); sealMap[c]=(sealMap[c]||0)+1; });
    const judged=sealMap.ok+sealMap.warn+sealMap.bad;
    const rate=judged?Math.round(sealMap.ok*100/judged)+'%':'—';
    const now=new Date();
    const days=[];
    for(let i=6;i>=0;i--){
      const d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);
      days.push({k:d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0')+'-'+String(d0.getDate()).padStart(2,'0'), l:(d0.getMonth()+1)+'/'+d0.getDate(), n:0});
    }
    rs.forEach(r=>{ const d=new Date(r.ts); const kk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); const hit=days.find(x=>x.k===kk); if(hit) hit.n++; });
    const dmax=Math.max(1,...days.map(x=>x.n));
    const trend=days.map(d=>`
      <div class="db-col"><b>${d.n||''}</b><span class="db-bar" style="height:${Math.max(3,Math.round(d.n*64/dmax))}px"></span><i>${d.l}</i></div>`).join('');
    const sealHtml=[
      ['ok','#17734a','合规通过',sealMap.ok],['warn','#b8860b','已核查·有提示',sealMap.warn],
      ['bad','#c53f33','需复核',sealMap.bad],['idle','#5d7067','病历·已入档',sealMap.idle]
    ].map(([c,cl,l,n])=>`<div style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--ink)"><span class="db-dot" style="background:${cl}"></span>${l}<span style="flex:1"></span><b>${n}</b></div>`).join('');
    const srcs=[
      ['窗口','window'],['框选','region'],['剪贴板','clipboard'],['界面文本','uia']
    ].map(([l,k])=>[l, rs.filter(r=>r.source===k).length]).filter(x=>x[1]>0);
    const others=rs.length-['window','region','clipboard','uia'].reduce((s,k)=>s+rs.filter(r=>r.source===k).length,0);
    if(others>0) srcs.push(['其它',others]);
    // 科室分布始终按全量记录统计（点行可筛选），筛选态下当前科室高亮
    const deptAll=new Map();
    records.forEach(r=>{ const d=(r.dept||'').trim()||'（未标注）'; deptAll.set(d,(deptAll.get(d)||0)+1); });
    const deptItems=[...deptAll.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
    const chips=['<button class="fchip'+(dashDept==='all'?' on':'')+'" data-d="all">全部科室 '+records.length+'</button>']
      .concat(depts.map(d=>{
        const n=records.filter(r=>(r.dept||'').trim()===d).length;
        return '<button class="fchip'+(dashDept===d?' on':'')+'" data-d="'+escAttr(d)+'">'+escapeHtml(d)+' '+n+'</button>';
      })).join('');
    main.innerHTML=`<div class="dwrap" style="max-width:980px">
      <div class="dhead">
        <div class="dt" style="display:flex;align-items:center;gap:12px">📊 数据看板
          <span style="font-size:12px;color:var(--mut);font-weight:400;font-family:inherit;letter-spacing:0">本地采集数据统计 · 全程离线 · 数据不出本机</span>
          <span style="flex:1"></span>
          <button class="ghost" onclick="seedDemoData()">✨ 预置演示数据</button>
          <button class="ghost" onclick="exitDash()">‹ 返回记录</button>
        </div>
      </div>
      <div class="dchips">${chips}</div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px">
        <div class="db-metric"><div class="k">采集记录</div><div class="v">${total}</div><div class="s">${dashDept==='all'?'全部科室':'科室：'+escapeHtml(dashDept)}</div></div>
        <div class="db-metric"><div class="k">已分析</div><div class="v">${analyzed}</div><div class="s">${total?Math.round(analyzed*100/total):0}% 完成分析</div></div>
        <div class="db-metric"><div class="k">覆盖科室 / 患者</div><div class="v">${deptN}<span style="font-size:14px;color:var(--mut);font-weight:400"> / ${patients}</span></div><div class="s">科室归属用于归档检索</div></div>
        <div class="db-metric"><div class="k">审方合规通过率</div><div class="v">${rate}</div><div class="s">已审方 ${judged} 条（不含纯病历入档）</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px">
        <div class="db-card"><div class="t">近 7 天采集趋势</div><div class="db-trend">${trend}</div></div>
        <div class="db-card"><div class="t">审方结论分布</div>${sealHtml}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
        <div class="db-card"><div class="t">科室分布 <span class="db-tip">点击筛选</span></div>${deptRows(deptItems)}</div>
        <div class="db-card"><div class="t">高频证型 TOP</div>${dbRows(topCounts(rs.map(r=>r.synd)), document.body.classList.contains('flat')?'#2563eb':'#2f8f62')}</div>
        <div class="db-card"><div class="t">高频诊断 TOP</div>${dbRows(topCounts(rs.map(r=>r.diag)),'#1b5fae')}</div>
        <div class="db-card"><div class="t">来源分布</div>${dbRows(srcs,'#b8860b')}</div>
      </div>
    </div>`;
    main.querySelectorAll('.dchips [data-d]').forEach(b=>{ b.onclick=()=>dashPickDept(b.dataset.d); });
    main.querySelectorAll('.db-deptrow[data-d]').forEach(el=>{ el.onclick=()=>dashPickDept(el.dataset.d); });
  }
  function exitDash(){ renderDetail(); }

  // ===== 使用说明页：按场景分节（单节渲染，避免长滚动），支持关键词定位 =====
  const HELP_SECS = [
    { id:'start', ico:'🚀', title:'快速上手', html:`
      <h4>三步完成一次采集与审方</h4>
      <div class="lead">全流程在本机运行：离线中医库 + 可选本地/私有化大模型，病历文本不上传第三方。</div>
      <div class="hsteps">
        <div class="hstep"><span class="n">1</span><b>采集</b><span>在医院系统里选中病历/医嘱 → <span class="hkbd">Ctrl+C</span> → 按 <span class="hkbd">Ctrl+Alt+V</span> 粘贴入库（推荐，零识别误差）；图片内容用左侧「框选抓取」。</span></div>
        <div class="hstep"><span class="n">2</span><b>核对</b><span>中药卡片红框＝缺剂量 / 药名未入库 / 剂量异常。可在「处方（可编辑）」里直接改药名剂量，保存后重跑分析。</span></div>
        <div class="hstep"><span class="n">3</span><b>分析</b><span>确认「中医诊断·证型」→ 本地分析 → 查看审方印章、辨证结论与量化指标；需要时点「AI 解读」。</span></div>
      </div>
      <div class="hnote">采集后自动保存并跑一次本地分析；有缺项时结论会<b>暂扣</b>，修正或写明理由强制放行后才展示。</div>
      <h5>本文档怎么用</h5>
      <div class="lead" style="margin:0">上方胶囊按场景分节，点一节只看一节；搜索框输入「粘贴 / 剂量 / 剔除 / 备份」等词，可直接跳到含该词的章节并高亮。</div>
    `},
    { id:'capture', ico:'📥', title:'采集方式', html:`
      <h4>五种采集方式</h4>
      <div class="lead">文本用剪贴板/界面文本，图像用框选/拍照，整窗用窗口采集——按内容形态选，识别准确率差别很大。</div>
      <table class="htbl"><thead><tr><th>方式</th><th>入口</th><th>适用</th><th>说明</th></tr></thead><tbody>
        <tr><td><b>粘贴采集</b></td><td><span class="hkbd">Ctrl+Alt+V</span> / 左侧按钮</td><td>病历、医嘱、处方文本</td><td>文本原样入库，<b>零识别误差</b>；长单行、多段混排都能处理</td></tr>
        <tr><td><b>框选抓取</b></td><td>左侧「框选抓取」</td><td>HIS 界面、图片区域</td><td>全屏遮罩拖框，可拖动边缘调选区；<span class="hkbd">Esc</span> 取消</td></tr>

  function helpHit(s, q){
    if(!q) return 0;
    const t = (s.title + ' ' + s.html).replace(/<[^>]+>/g, ' ');
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    const m = t.match(re);
    return m ? m.length : 0;
  }
  /** 只在文本节点内高亮（跳过标签与属性，避免破坏结构） */
  function helpHl(html, q){
    if(!q) return html;
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return html.replace(/>([^<>]+)</g, (m, txt) => '>' + txt.replace(re, x => '<mark class="hmark">' + x + '</mark>') + '<');
  }
  function showHelp(sec){
    helpMode = true;

    setKbMode(false);
    const side = document.querySelector('.side');
    if(side) side.style.display = '';
    const main = document.getElementById('main');
    if(main){
      main.classList.remove('kbhost');
      main.innerHTML = `<div class="dwrap hwrap">
        <div class="dhead">
          <div class="dt">❔ 使用说明<span style="font-size:12px;color:var(--mut);font-weight:400;font-family:inherit;letter-spacing:0">采集 → 核对 → 分析 → 审方</span></div>
          <div class="dm">按场景分节查看，点胶囊切换；搜索关键词可直接跳到含该词的章节并高亮。</div>
          <div class="dact">
            <input class="hq" id="helpQ" placeholder="搜索：粘贴 / 红线 / 剔除 / 备份…" oninput="helpSearch(this.value)">
            <span id="helpCnt" style="font-size:11.5px;color:var(--mut)"></span>
            <div class="sp"></div>
            <button class="ghost" onclick="renderDetail()">‹ 返回记录</button>
          </div>
        </div>

  }
  function helpPaint(){
    const q = (helpQ || '').trim();
    if(q){
      const cs = HELP_SECS.find(s => s.id === helpSec);
      if(!cs || !helpHit(cs, q)){
        const first = HELP_SECS.find(s => helpHit(s, q) > 0);
        if(first) helpSec = first.id;
      }
    }
    const sec = HELP_SECS.find(s => s.id === helpSec) || HELP_SECS[0];
    const nav = document.getElementById('helpNav');
    if(nav){
      nav.innerHTML = HELP_SECS.map(s => {
        const n = helpHit(s, q);
        return `<button class="${s.id === helpSec ? 'on' : ''}${q && n ? ' hit' : ''}" data-s="${s.id}" onclick="helpGo('${s.id}')">${s.ico} ${s.title}${q ? `<span class="n">${n}</span>` : ''}</button>`;
      }).join('');
    }
    const card = document.getElementById('helpCard');
    if(card) card.innerHTML = `<div class="hcard" data-s="${sec.id}">${helpHl(sec.html, q)}</div>`;
    const cnt = document.getElementById('helpCnt');
    if(cnt){
      const total = q ? HELP_SECS.reduce((n, s) => n + helpHit(s, q), 0) : 0;
      cnt.textContent = q ? (total ? `共 ${total} 处匹配` : '无匹配：试试「采集 / 红线 / 备份」') : '';

  let sideQ='', sideStatus='all', sideSrc='all', sideComp='all', sideDay='all', sideDept='all';

      const d=(r.dept||'').trim();
      if(sideDept==='__none'){ if(d) return false; }
      else if(d!==sideDept) return false;
    }
    // 合规筛选：与审方印章 sealCls 同口径（ok 合规通过 / warn 有提示 / bad 存在不符 / idle 未分析）
    if(sideComp!=='all' && sealCls(r)!==sideComp) return false;
    // 日期筛选：按采集时间
    if(sideDay!=='all'){
      const ts=+new Date(r.ts||0); if(!ts) return false;
      const day=x=>{ const d=new Date(x); return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(); };
      const diff=Math.round((day(Date.now())-day(ts))/86400000);
      if(sideDay==='today'){ if(diff>0) return false; }
      else { const n=+sideDay.slice(0,-1); if(diff>=n) return false; }
    }
    const q=sideQ.trim().toLowerCase();
    if(!q) return true;
    const h=pyHay(r);
    return h.txt.toLowerCase().includes(q) || (h.py&&h.py.includes(q)) || (h.py0&&h.py0.includes(q));
  }
  function dayKey(ts){
    const d=new Date(ts), now=new Date();
    const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
    const diff=Math.round((day(now)-day(d))/86400000);
    if(diff<=0) return '今天';
    if(diff===1) return '昨天';
    if(diff<7) return '近7天';
    return '更早';
  }

  function renderPatientGroups(side, vis){
    const map=new Map();
    vis.forEach(r=>{ const k=((r.patient||'').trim()||'未标注'); if(!map.has(k)) map.set(k,[]); map.get(k).push(r); });
    const keys=[...map.keys()];

      side.innerHTML='<div style="padding:20px 16px;color:#93a49a;text-align:center;line-height:2">还没有患者标注<br>打开记录详情，点「患者 未标注 ✎」标注姓名<br>即可按人聚合就诊记录</div>';

        </div>

      ${reviewBarHtml(cur)}
      <div id="qcTrace">${qcForcedHtml(cur)}</div>
      ${keyHtml}
      <div id="rxBlocks"></div>
      <div id="an"></div>
      <div id="aiCard"></div>
      <div id="recsHost"></div>
      <div id="blocks"></div>
    </div>`;
    // 脱敏切换
    document.getElementById('btnMask').onclick=()=>{ maskedView=true; syncToggle(); };
    document.getElementById('btnRaw').onclick=()=>{ maskedView=false; syncToggle(); };
    bindReviewBar();
    renderBlocks(shown);  // 先于 renderAn：RXE 网格行就绪后，处方中药速览才能映射炮制品名
    renderAn();
    renderAiCard();
    bindImg();
    renderSeal();
  }

  // ===== 人工复核条：机器核查为「已核查·有提示」的记录由药师裁定 =====
  // 通过 → 记录打「已存档」标记并从默认列表隐去（侧栏「已存档」入口可查）
  // 驳回 → 打「已驳回」红标留在列表待修改，可填原因，随时可改判回通过
  // HTML / 状态机 / 落库流程全部在 renderer/review-bar.js，辨证咨询窗复用同一份；
  // 内联 onclick 用的 rvSet / rvClear / rvAsk / rvCancel 由 ReviewBar.mount 挂到 window。
  function reviewBarHtml(r){ return ReviewBar.html(r); }
  function bindReviewBar(){ ReviewBar.bind(); }

  // ===== 审方印章：汇总病历质控 + 处方合规 + 相符性核查 → 单一结论突出显示 =====
  function reviewSeal(){
    if(!cur || !isAnalyzed(cur)) return null;
    const {bad,warn}=sealCounts(cur);
    const t=cur.tcm;
    const d=new Date(cur.ts||Date.now());
    const ds=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
    // 人工复核裁定优先于机器结论（药师签字优先）：通过→合规·已通过（存档）；驳回→审方·已驳回
    const rv=reviewOf(cur);
    if(rv && rv.status==='pass')   return {cls:'seal-ok',  l1:'合规', l2:'已通过', date:ds, sub:'人工复核 · 已存档'};
    if(rv && rv.status==='reject') return {cls:'seal-rej', l1:'审方', l2:'已驳回', date:ds, sub:'人工复核 · 待修改'};
    if(bad>0)  return {cls:'seal-bad',  l1:'审方', l2:'需复核', date:ds};
    // 纯病历（未含处方/药味）：不存在"合规"审方对象 → 灰色"病历·已入档"，不出具合规结论
    if(!(t && t.rx)) return {cls:'seal-idle', l1:'病历', l2:'已入档', date:ds};
    if(warn>0) return {cls:'seal-warn', l1:'已核查', l2:'有提示', date:ds};
    return       {cls:'seal-ok',    l1:'合规', l2:'已通过', date:ds};
  }
  function renderSeal(){
    const dwrap=document.querySelector('.dwrap');
    if(!dwrap) return;
    const old=dwrap.querySelector('.seal'); if(old) old.remove();
    const s=reviewSeal();
    if(s) dwrap.insertAdjacentHTML('beforeend',
      `<div class="seal ${s.cls}"><i></i><b>${s.l1}<br>${s.l2}</b><s>${s.date} · ${s.sub||'本地质控'}</s></div>`);
  }

  // ===== 辨证分析工作台：截图后手动分析（不再自动生成方剂/合规） =====
  let wbDiags = null;          // 临床诊断候选（惰性加载一次）
  let wb = { diag: '', synd: '' };
  function openConsultCtx(){ if(!cur){ toast('请先选择左侧一条记录'); return; } window.qhjf.openConsult(cur.id); }
  async function ensureWbDiags(){
    if (wbDiags) return wbDiags;
    try {
      const arr = await window.qhjf.clinicalList('diag');
      wbDiags = Array.isArray(arr) ? arr : [];
    } catch(e){ wbDiags = []; }
    return wbDiags;
  }
  let anForceWb = false;   // 「调整辨证」强制回工作台
  let wbInitedFor = null;  // 当前记录是否已按 an 预填过工作台
  function syndBarHtml(an){
    // 自动辨证条：病历截图自动生成的诊断/证型依据
    if (an && an.auto) {
      const ok = !!an.synd;
      const ev = (an.evidence && an.evidence.length) ? `<span class="sbe">依据：${an.evidence.map(escapeHtml).join('；')}</span>` : '';
      return `<div class="synbar ${ok?'ok':'miss'}">
        <span class="sbt">🩺 证型诊断${ok?'':'（未定）'}</span>
        <span class="sbm">${an.diag?escapeHtml(an.diag):'—'}${ok?' · <b>'+escapeHtml(an.synd)+'</b>':' · 未识别到明确证型，可补选后分析'}</span>
        <button class="adj" onclick="anAdjust()">调整辨证</button>${ev}
      </div>`;
    }
    // 手动分析后的结果页：显示本次所选诊断/证型，并提供「返回重选」回到工作台
    if (an) return ''; // 自动辨证失败占位，不渲染
    const dg = (cur && cur.diag) || '', sd = (cur && cur.synd) || '';
    return `<div class="synbar ok">
      <span class="sbt">🩺 本次分析依据</span>
      <span class="sbm">${dg?escapeHtml(dg):'—'}${sd?' · <b>'+escapeHtml(sd)+'</b>':' · 未指定证型'}</span>
      <button class="adj" onclick="anAdjust()">返回重选</button>
    </div>`;
  }
  function anAdjust(){
    if (!cur) return;
    // 回工作台并带入上次所选（自动辨证带入判定值；手动分析带入用户选择）
    const src = (cur.an && cur.an.auto) ? cur.an : { diag: cur.diag || '', synd: cur.synd || '' };
    wb = { diag: src.diag || '', synd: src.synd || '' };
    wbInitedFor = cur.id;   // 防止工作台自动预填覆盖本次带入
    anForceWb = true;
    renderAn();
  }
  // ===== 识别质检（缺剂量 / 药名未入库 / 剂量异常 / 缺用法剂数）=====
  // 红框标出在「处方中药」chips 上；error 级问题拦截本地分析与 AI 分析，可点「强制分析」放行
  let qcForceFlag = false;    // 本地分析放行标记（一次性）
  let qcForceReason = '';     // 强制放行理由（落库 qc.forced，可追溯）
  let aiForceFlag = false;    // AI 解读放行标记（一次性）
  let aiForceReason = '';     // AI 强制放行理由（落库 qc.forced，可追溯）
  function qcBarHtml(QC){
    if (!QC || QC.ok === false) return '';
    const hasSubs = !!(QC.subs && QC.subs.length);
    const hasBlock = !!QC.block, hasWarn = !!QC.warnN || !!(QC.rx && QC.rx.length) || hasSubs;
    if (!hasBlock && !hasWarn) return '';
    const list = (QC.items || []).map(x => `<a class="qclink" onclick="rxLocate('${rxAttr(x.name)}',true,true)" title="点击定位；处方框中没有该药时自动补录一行">${escapeHtml(x.name)}</a>（${x.issues.map(g => g.label).join('/')}）`);
    const more = list.length > 6 ? ` 等 ${(QC.items || []).length} 味` : '';
    const rxTxt = (QC.rx || []).map(g => g.label).join('、');
    // 库比对：识别名与中药库规范名不同（别名/纠错替换），仅提示供核对
    const subTxt = hasSubs ? QC.subs.map(s => `${s.raw}→${s.canon}`).join('、') : '';
    const F = QC.forced || null;
    // 已强制放行：黄条留痕展示（分析结论正常可见，但缺项仍提示补全）
    if (hasBlock && F) {
      return `<div class="qcbar forced">
        <span class="qct"><b>⚠ 已强制放行</b>：理由「${escapeHtml(F.reason || '')}」${F.at ? '· ' + escapeHtml(String(F.at).replace('T', ' ').slice(0, 16)) : ''}
          <span class="qcl">本条仍有 ${QC.errN} 项待修正（${escapeHtml(QC.summary || '')}），建议尽快补全后重新分析。</span>
          ${list.length ? `<span class="qcl">待修正药味：${list.slice(0, 6).join('、')}${more}</span>` : ''}
          ${subTxt ? `<span class="qcl">库比对：${escapeHtml(subTxt)}（识别名与库规范名不同，已按库匹配）</span>` : ''}
        </span>
      </div>`;
    }
    const head = hasBlock
      ? `<b>⚠ 已拦截分析</b>：${QC.errN} 项待修正（${escapeHtml(QC.summary || '')}）`
      : `<b>识别提示</b>：${escapeHtml(QC.summary || '')}`;
    const tail = hasBlock ? '请核对红框标出的药味后再分析；确需按当前结果分析，须写明理由强制放行。' : '不影响分析，供核对参考。';
    return `<div class="qcbar${hasBlock ? '' : ' warn'}">
      <span class="qct">${head}——${tail}
        ${list.length ? `<span class="qcl">待修正药味：${list.slice(0, 6).join('、')}${more}</span>` : ''}
        ${rxTxt ? `<span class="qcl">处方级：${escapeHtml(rxTxt)}</span>` : ''}
        ${subTxt ? `<span class="qcl">库比对：${escapeHtml(subTxt)}（识别名与库规范名不同，已按库匹配，供核对）</span>` : ''}
      </span>
      ${hasBlock ? `<span class="qcf" id="qcfRow">
          <input id="qcfReason" placeholder="强制放行理由（必填，留痕可追溯）" onkeydown="if(event.key==='Enter')qcForceGo()">
          <button class="qcbtn" onclick="qcForceGo()">确认强制</button>
        </span>
        <button class="qcbtn ghost" onclick="qcForce()">强制分析</button>` : ''}
    </div>`;
  }
  /** 强制放行留痕条：拦截解除后仍在详情顶部保留理由（拦截态由分析区黄条展示，避免重复） */
  function qcForcedHtml(r){
    const F = r && r.qc && r.qc.forced;
    if (!F || !F.reason) return '';
    if (r.qc.block) return '';   // 仍处拦截态：qcBarHtml 的「已强制放行」黄条已展示同一信息
    const at = String(F.at || '').replace('T', ' ').slice(0, 16);
    return `<div class="qctrace"><span class="qt">⚠ 曾强制放行</span>理由「${escapeHtml(F.reason)}」
      ${at ? `<span class="qts">· ${escapeHtml(at)}</span>` : ''}
      <span class="qts">· 本条缺项未修正即出结论，理由已落库（qc.forced）备查</span></div>`;
  }
  /** 拦截态结果页：缺项未修正且未强制放行 → 不展示分析结论，只出拦截卡 */
  function qcHoldHtml(QC){
    const bar = qcBarHtml(QC);
    return `${bar}
      <div class="qchold">
        <div class="qcht">🔒 分析结论已暂扣</div>
        <div class="qchd">本条处方存在 ${QC.errN} 项 error 级识别问题（${escapeHtml(QC.summary || '')}），
          修正前不生成处方合规分析与辨证结论，避免带缺项的结果进入临床参考。</div>
        <div class="qchd">👉 可在上方「处方（可编辑）」网格补全缺剂量药味后点「保存并重新分析」；
          确需按当前识别结果分析，点「强制分析」并写明理由（理由将留痕到本条记录）。</div>
      </div>`;
  }
  /** 「强制分析」→ 展开理由输入（不直接放行） */
  function qcForce(){
    const row = document.getElementById('qcfRow');
    if (!row) { qcHoldReopen(); return; }
    row.style.display = 'inline-flex';
    const inp = document.getElementById('qcfReason');
    if (inp) { inp.focus(); }
  }
  /** 拦截态页没有预渲染理由行时，先重绘拦截卡再展开 */
  function qcHoldReopen(){
    if (!cur || !(cur.qc && cur.qc.block)) return;
    anForceWb = false; renderAn();
    requestAnimationFrame(() => { const row = document.getElementById('qcfRow'); if (row) { row.style.display = 'inline-flex'; const i = document.getElementById('qcfReason'); if (i) i.focus(); } });
  }
  /** 确认强制：理由必填 → 放行本地分析 */
  function qcForceGo(){
    const inp = document.getElementById('qcfReason');
    const v = String((inp && inp.value) || '').trim();
    if (!v) { toast('请先填写强制放行理由（将留痕到本条记录）'); if (inp) inp.focus(); return; }
    qcForceFlag = true; qcForceReason = v;
    wbRunLocal();
  }

  // ===== 处方量化指标条（点评口径）：味数 / 单剂g / 每日g / 剂数 / 天数 / 总计g / 均g·味 =====
  // 数据源 t.rx.stat（lib/rxmetric.js 产出，后端两侧同源）；历史记录为旧 stat 时按 herbDoses 现算兜底。
  let RX_RULE = null, RX_RULE_LOADING = false, RX_MET_T = null;
  function rxMetricOf(t){
    const st = (t && t.rx && t.rx.stat) || {};
    if (st.herbN !== undefined || st.doseG !== undefined) {
      return { herbN: st.herbN || 0, doseG: st.doseG || 0, dailyJi: st.dailyJi || 1, dailyG: st.dailyG || 0,
        ji: st.ji || 0, days: st.days || 0, totalG: st.totalG || 0, avgG: st.avgG || 0,
        maxG: st.maxG || 0, maxN: st.maxN || '', noDoseN: st.noDoseN || 0, jiManual: !!st.jiManual };
    }
    // 兜底：旧结构 stat（升级前的记录）——味数与克重现算，剂数/天数从原文正则取
    const herbs = (t && t.herbs) || [];
    const dm = (t && t.herbDoses) || {};
    let g = 0, n = 0, maxG = 0, maxN = '';
    for (const h of herbs) {
      const d = dm[h]; if (!d) continue;
      const unit = String(d.unit || '').toLowerCase();
      if (unit !== 'g' && unit !== '克') continue;
      const v = Number(d.val); if (!isFinite(v) || v <= 0) continue;
      g += v; n++;
      if (v > maxG) { maxG = v; maxN = h; }
    }
    const txt = String((cur && cur.text) || (t && t.text) || '');
    const cleared = txt.replace(/每\s*日\s*\d+\s*剂/g, '');
    let m = cleared.match(/味\s*(\d{1,3})\s*(?:剂|付|帖)/);
    if (!m) m = cleared.match(/(\d{1,3})\s*(?:剂|付|帖)(?!\s*[型量])/);
    const jiAuto = m ? (parseInt(m[1], 10) || 0) : 0;
    // 手填剂数优先（panel:patch → rec.rxJi；旧记录 stat 未更新时也能显示正确）
    const jiMan = Number(cur && cur.rxJi) > 0 ? Math.round(Number(cur.rxJi)) : 0;
    const ji = jiMan || jiAuto;
    const um = txt.match(/每\s*日\s*(\d+(?:\.\d+)?)\s*剂/);
    const dailyJi = um ? (parseFloat(um[1]) || 1) : 1;
    const r2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
    g = r2(g);
    return { herbN: herbs.length, doseG: g, dailyJi, dailyG: r2(g * dailyJi), ji,
      days: ji > 0 ? r2(ji / dailyJi) : 0, totalG: ji > 0 ? r2(g * ji) : 0,
      avgG: n ? r2(g / n) : 0, maxG: r2(maxG), maxN, noDoseN: herbs.length - n, jiManual: !!jiMan };
  }
  /** 红线级别：'' 正常 / warn 达提醒值 / err 超红线；红线关闭或无阈值时按正常处理 */
  function rxMetricLv(v, on, warn, err){
    if (!on || !(v > 0)) return '';
    if (err > 0 && v >= err) return 'err';
    if (warn > 0 && v >= warn) return 'warn';
    return '';
  }
  function rxMetricBarHtml(t){
    const m = rxMetricOf(t);
    if (!m || !m.herbN) return '';
    const R = RX_RULE || {};
    const n2 = v => (Math.round(v * 100) / 100);
    const lvHerb = rxMetricLv(m.herbN, R.herbOn !== false, R.herbWarn, R.herbErr);
    const lvDay = rxMetricLv(Math.floor(m.days), R.jiOn !== false, R.jiWarn, R.jiErr);
    const it = (cls, lb, val, tip) =>
      `<span class="mi ${cls}"${tip ? ` title="${escapeHtml(tip)}"` : ''}><span class="lb">${lb}</span><b>${val}</b></span>`;
    const doseTip = m.noDoseN > 0 ? `${m.herbN - m.noDoseN} 味计入克重，${m.noDoseN} 味未识别到剂量` : `${m.herbN} 味全部计入克重`;
    const herbTip = lvHerb ? `味数${lvHerb === 'err' ? '超出红线' : '已达提醒值'}（提醒 ${R.herbWarn} 味 / 红线 ${R.herbErr} 味），属「大处方」点评项` : '';
    const dayTip = lvDay
      ? `用药天数${lvDay === 'err' ? '超出红线' : '已达提醒值'}（提醒 ${R.jiWarn} 剂 / 红线 ${R.jiErr} 剂），属「超疗程」点评项；天数 = 剂数 ÷ 每日剂数`
      : (m.ji > 0 ? `天数 = 剂数 ${m.ji} ÷ 每日 ${n2(m.dailyJi)} 剂（每日剂数取自用法「每日N剂」，缺省按 1 剂）` : '未识别到剂数（原文无「N剂 / N付 / N帖」）：点击左侧「剂数」补填，天数自动折算');
    const out = [];
    out.push(it(lvHerb, '味数', m.herbN, herbTip || doseTip));
    if (m.doseG > 0) out.push(it('', '单剂', n2(m.doseG) + 'g', doseTip + (m.avgG > 0 ? `；均 ${n2(m.avgG)}g/味` : '')));
    if (m.dailyG > 0) out.push(it('', (m.dailyJi > 1 ? `每日${n2(m.dailyJi)}剂` : '每日'), n2(m.dailyG) + 'g', `单剂 ${n2(m.doseG)}g × 每日 ${n2(m.dailyJi)} 剂`));
    // 剂数：可点击手填（自动识别原文「N剂 / N付 / N帖」；识别不到时补录）——天数、总计随它重算
    const jiCls = (m.ji > 0 ? '' : 'na') + (m.jiManual ? ' man' : '');
    const jiTip = (m.jiManual ? `手填剂数 ${m.ji} 剂（点击修改；清空 = 回到原文自动识别）` : (m.ji > 0 ? `按原文识别：${m.ji} 剂（点击可改）` : '原文未识别到剂数，点击填写（支持 剂 / 付 / 帖）'))
      + `。天数 = 剂数 ÷ 每日剂数（当前每日 ${n2(m.dailyJi)} 剂）`;
    out.push(`<span class="mi edit ${jiCls}" id="miJi" onclick="rxJiEdit(event)" title="${escapeHtml(jiTip)}"><span class="lb">剂数</span><b>${m.ji > 0 ? m.ji : '—'}</b><i class="pj">✎</i></span>`);
    out.push(it(m.ji > 0 ? lvDay : 'na', '天数', m.days > 0 ? n2(m.days) : '—', dayTip));
    if (m.totalG > 0) out.push(it('', '总计', n2(m.totalG) + 'g', `单剂 ${n2(m.doseG)}g × ${m.ji} 剂`));
    if (m.maxN && m.maxG > 0) out.push(it('', '最重', `${escapeHtml(m.maxN)} ${n2(m.maxG)}g`, '本方单味用量最大的药味'));
    return out.join('');
  }
  /** 指标条外壳（无药味时不占位）；仅走外壳才记录「最近渲染的处方」，供红线到位后重刷 */
  function rxMetricBar(t){
    const inner = rxMetricBarHtml(t);
    if (!inner) return '';
    RX_MET_T = t;
    return `<div class="rxmt" id="rxmt">${inner}</div>`;
  }
  /** 红线配置懒加载（后台「点评红线」页签维护，存 kv['rxrule']）；到位后重刷指标条配色 */
  function rxMetricRefresh(){
    const box = document.getElementById('rxmt');
    if (box && RX_MET_T) box.innerHTML = rxMetricBarHtml(RX_MET_T);
  }
  // ===== 剂数手填（指标条「剂数」点击录入）=====
  // 场景：HIS 原文没打印「N剂/N付/N帖」时自动识别不到 → 医生直接点指标条补录。
  // 落库 panel:patch {rxJi}（0/空 = 清除，回落自动识别），后端同时重算 tcm.rx.stat 的 ji/days/totalG，
  // 保证前台指标条、后台点评天数红线读的是同一份数。
  let RX_JI_BUSY = false;
  function rxJiEdit(ev){
    if (ev && ev.stopPropagation) ev.stopPropagation();
    const el = document.getElementById('miJi');
    if (!el || el.querySelector('input')) return;
    const m = rxMetricOf(cur && cur.tcm) || {};
    el.classList.remove('na', 'man');
    el.innerHTML = '<span class="lb">剂数</span><input class="mij" id="mij" type="text" inputmode="numeric" maxlength="3" value="' + (m.ji > 0 ? m.ji : '') + '" title="填数字后回车；留空 = 回到原文自动识别">';
    const i = document.getElementById('mij');
    try { i.focus(); i.select(); } catch (e) { /* 无焦点环境忽略 */ }
    i.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); rxJiSave(i.value); }

  async function rxJiSave(raw){
    if (!cur || RX_JI_BUSY) return;
    const digits = String(raw == null ? '' : raw).replace(/[^\d]/g, '');
    const n = digits ? Math.min(parseInt(digits, 10) || 0, 999) : 0;
    const old = Number(cur.rxJi || 0);
    if (n === old) { rxMetricRefresh(); return; }
    RX_JI_BUSY = true;
    try {
      const r = await window.qhjf.patchRecord(cur.id, { rxJi: n });
      if (!r || !r.ok) { toast((r && r.error) || '剂数保存失败'); rxMetricRefresh(); return; }
      cur.rxJi = n > 0 ? n : undefined;
      if (r.rec && r.rec.tcm) { cur.tcm = r.rec.tcm; RX_MET_T = cur.tcm; }
      rxMetricRefresh();
      const m = rxMetricOf(cur.tcm) || {};
      toast(n > 0
        ? `剂数已设为 ${n} 剂${m.days > 0 ? '，天数按每日 ' + (Math.round((m.dailyJi || 1) * 100) / 100) + ' 剂折算为 ' + m.days + ' 天' : ''}`
        : '已清除手填剂数，改按原文自动识别');
    } catch (e) {
      toast('剂数保存失败：' + (e && e.message ? e.message : e));
      rxMetricRefresh();
    } finally { RX_JI_BUSY = false; }
  }

  function wbRefreshDatalist(){

  async function wbWestSearch(kw){
    const k=String(kw||'').trim();
    if(k.length<2){ wbWestNames=[]; wbRefreshDatalist(); return; }
    if(k===westLastQ) return;
    const seq=++westSearchSeq;
    try{
      const r=await window.qhjf.icdSearch(k,'all');
      if(seq!==westSearchSeq) return;
      westLastQ=k;
      const tcmNames=new Set((wbDiags||[]).map(d=>d.name).filter(Boolean));
      const names=[];
      (r&&r.list||[]).forEach(x=>{ const n=x.ybName||x.glName; if(n&&n.includes(k)&&!tcmNames.has(n)&&!names.includes(n)) names.push(n); });
      names.sort((a,b)=>a.length-b.length);
      wbWestNames=names.slice(0,12);
      wbRefreshDatalist();
    }catch(e){}

    }

    host.innerHTML=`<div class="aic"><div class="aih"><span class="tt">✦ AI 智能解读</span><span class="ts">${escapeHtml(st.model||'云端模型')}${st.mock?' · 演示模式':''}</span><div class="sp2"></div>
        <button onclick="genAi()">重新生成</button></div>
      <div class="aib"><div class="md">${window.MD.render(st.md||'')}</div>${modeTag}
        <div class="ai-meta">生成于 ${new Date(st.at).toLocaleTimeString('zh-CN',{hour12:false})}${st.continued?' · 输出较长，已自动续写补全':''} · 本内容由 AI 生成，仅供学习参考，需经执业医师核对</div></div></div>`;
  }
  // ===== AI 分析进度条：只反映真实里程碑（AI 层上报的 prep/request/round/done） =====
  let aiProgTimer=null, aiProgT0=0;
  function aiProgUpdate(p){
    const bar=document.getElementById('aiProgBar'); if(!bar) return;
    const pct=Math.max(0, Math.min(100, Number(p && p.pct)||0));
    bar.style.width=pct+'%';
    const pc=document.getElementById('aiProgPct'); if(pc) pc.textContent=String(pct);
    const lb=document.getElementById('aiProgLabel'); if(lb && p && p.label) lb.textContent=p.label;
  }
  function aiProgTick(){
    const el=document.getElementById('aiProgElapsed');
    if(!el){ aiProgStopTimer(); return; }   // 卡片已被结果替换 → 计时器自动收摊
    el.textContent=String(Math.max(0, Math.round((Date.now()-aiProgT0)/1000)));
  }
  function aiProgTimerStart(){
    aiProgStopTimer(); aiProgT0=Date.now(); aiProgTick();
    aiProgTimer=setInterval(aiProgTick, 1000);
  }
  function aiProgStopTimer(){ if(aiProgTimer){ clearInterval(aiProgTimer); aiProgTimer=null; } }

  async function genAi(ov){
    if(!cur) return;
    aiState={recId:cur.id, status:'busy', prog:{pct:6, label:'准备分析上下文（脱敏文本 + 规则引擎结果）…'}};
    renderAiCard();
    try{
      const payload={id:cur.id};
      if(ov && ov.diag) payload.diag = ov.diag;
      if(ov && ov.synd) payload.synd = ov.synd;
      if(aiForceFlag){ payload.force = '1'; payload.reason = aiForceReason; }   // 质检拦截后的强制放行（理由留痕；force 用字符串，.NET 宿主 Args.Field 只认 String）
      const r=await window.qhjf.aiRun('record', payload);
      aiForceFlag = false; aiForceReason = '';
      if(r && r.blocked){
        aiState={recId:cur.id,status:'blocked',err:r.error||'识别结果存在待修正项',qc:r.qc||null,ov:ov||null};
      }else if(r&&r.ok){
        aiState={recId:cur.id,status:'ok',md:r.markdown||'',mode:r.mode||[],mock:!!r.mock,model:r.model||'',at:r.at||Date.now(),continued:!!r.continued};
        // 强制放行留痕已落库（qc.forced）：回读 qc，让详情留痕条与侧栏「已强制」标即时出现
        try{ const rec=await window.qhjf.getRecord(cur.id);
          if(rec&&rec.qc){ cur.qc=rec.qc; const ri=records.find(x=>x.id===rec.id); if(ri) ri.qc=rec.qc;
            const tr=document.getElementById('qcTrace'); if(tr) tr.innerHTML=qcForcedHtml(cur); renderList(); } }catch(e){}
      }else{
        aiState={recId:cur.id,status:'err',err:(r&&r.error)||'未知错误',code:r&&r.code};
      }
    }catch(e){ aiState={recId:cur.id,status:'err',err:e.message}; }
    aiProgStopTimer();
    renderAiCard();
  }

  function compHtml(c){

    const rows = (c.items||[]).map(it=>`
      <div class="it"><span class="dot ${it.level}"></span>

    return `<div class="comp"><div class="ch"><span class="tt">合规提示建议</span><span class="sc">得分 ${c.score} · ${escapeHtml(c.grade)} · ${focusN} 项需关注</span></div>${rows}<div class="foot">${escapeHtml(c.disclaimer||'')}</div></div>`;
  }

  // ===== 智能方剂分析 =====
  // ===== 医保说明辅助 =====
  // 剂量格式化：tcm doseMap 值为 {val, unit}（兼容纯字符串）
  function fmtDose(d){
    if(!d) return '';
    if(typeof d==='string') return d;
    return (d.val!=null && d.unit) ? d.val+d.unit : '';
  }
  function ybDetailText(yb){
    const parts=[];
    if(yb.code) parts.push('编码 '+yb.code);
    if(yb.limit) parts.push(yb.limit);
    if(yb.copay) parts.push('自付 '+yb.copay+'%');
    if(yb.note) parts.push(yb.note);
    return parts.length ? parts.join('；') : '按当地医保目录支付';
  }
  function ybTitleAttr(yb){
    const parts=['支付类别：'+(yb.payType||'未设')];
    if(yb.limit) parts.push(yb.limit);
    if(yb.copay) parts.push('自付 '+yb.copay+'%');
    if(yb.note) parts.push(yb.note);
    return parts.join('；');
  }
  // 逐药详情行（记录详情 + 中药弹窗共用）：默认一行(名+功效)，展开看 药性/用法/注意/基原
  function herbCompactRows(herbCards){
    if(!herbCards || !herbCards.length) return '';
    return herbCards.filter(Boolean).map(h=>{
      const toxBadge = h.tox ? '<span class="htox">毒性药</span>' : '';
      const pregBadge = h.pre===2 ? '<span class="hpreg">孕妇禁用</span>' : h.pre===1 ? '<span class="hpreg">孕妇慎用</span>' : '';
      const catBadge = h.category ? `<span class="hchip" style="font-size:9.5px;padding:0 6px">${escapeHtml(h.category)}</span>` : '';
      const yb = h.yb || null;
      const ybBadge = yb && yb.payType ? `<span class="yb-pill yb-${yb.payType==='自费'?'zf':(yb.payType==='甲类'?'jia':'yi')}" title="${escapeHtml(ybTitleAttr(yb))}">医保${escapeHtml(yb.payType)}</span>` : '';
      const ext = [];
      if(h.category) ext.push(`<span class="hl">分类</span>${escapeHtml(h.category)}`);
      if(h.sx && h.sx.length) ext.push(`<span class="hl">症状参考</span>${escapeHtml(h.sx.join('、'))}`);
      if(h.prop) ext.push(`<span class="hl">药性</span>${escapeHtml(h.prop)}`);
      if(h.use) ext.push(`<span class="hl">用法</span>${escapeHtml(h.use)}`);
      if(h.origin) ext.push(`<span class="hl">基原</span>${escapeHtml(h.origin)}`);
      if(h.note) ext.push(`<span class="hl">注意</span>${escapeHtml(h.note)}`);
      if(yb) ext.push(`<span class="hl">医保</span>${escapeHtml(ybDetailText(yb))}`);
      return `<details class="hitem"><summary><span class="hrow"><span class="hn2">${escapeHtml(h.n)}</span>${fmtDose(h.dose)?`<span style="color:#6b7362;font-size:10px;flex:none">${escapeHtml(fmtDose(h.dose))}</span>`:''}${catBadge}<span class="hfx2">${escapeHtml(h.fx||'')}</span>${toxBadge}${pregBadge}${ybBadge}</span></summary>
        <div class="hd">${ext.join('')||'暂无更多说明'}</div></details>`;
    }).join('');
  }
  // 中药详解：入口按钮（在分析栏内）+ 弹窗逐药查看
  let HERB_CARDS_CUR=null;
  function herbsEntryHtml(herbCards){

  // 中药数据映射：组成逐味药说明用（懒加载一次）
  let HERB_MAP=null, HERB_MAP_P=null;
  // 医保规则映射（详情弹窗用，懒加载一次；herbCards 的 yb 字段由引擎注入，两处数据源同库）
  let YB_MAP=null;
  function ensureYbMap(){
    if(YB_MAP) return Promise.resolve(YB_MAP);
    return window.qhjf.ybList().then(list=>{
      YB_MAP={};
      (list||[]).forEach(r=>{ if(r&&r.name&&!YB_MAP[r.name]) YB_MAP[r.name]=r; });
      return YB_MAP;
    }).catch(()=>{ YB_MAP={}; return YB_MAP; });
  }
  function ensureHerbMap(){
    if(HERB_MAP) return Promise.resolve(HERB_MAP);
    if(!HERB_MAP_P) HERB_MAP_P = window.qhjf.kbListAll().then(d=>{
      HERB_MAP={};
      ((d&&d.herbs)||[]).forEach(h=>{
        if(h&&h.n){ HERB_MAP[h.n]=h; (h.aliases||[]).forEach(a=>{ if(!HERB_MAP[a]) HERB_MAP[a]=h; }); }
      });
      return HERB_MAP;
    }).catch(()=>{ HERB_MAP={}; return HERB_MAP; });
    return HERB_MAP_P;
  }
  // 组成字符串 → 逐味药块（名+剂量+功效摘要，悬停看性味）；数据未就绪返回 null 回退纯文本
  function composeHtml(cstr){
    const s=String(cstr||'');
    if(!HERB_MAP||!s) return null;
    const toks=s.split(/[、，,;；\n]+/).map(x=>x.trim()).filter(Boolean);
    if(!toks.length) return null;
    const cells=toks.map(tok=>{
      const m=tok.match(/^([^\d]+)/);
      let name=m?m[1]:tok;
      const nameClean=name.replace(/[（(][^）)]*[)）]/g,'').replace(/各$/,'').trim();
      const dose=nameClean?tok.slice(name.indexOf(nameClean)+nameClean.length):'';
      const h=nameClean?HERB_MAP[nameClean]:null;
      if(!h) return `<span class="ci na"><span class="cn">${escapeHtml(tok)}</span></span>`;
      // OCR 错字命中（如 臼术→白术）：显示纠正后正名并标注，title 注明原文
      const ocrHit = h.ocr && h.ocr[nameClean];
      const showName = ocrHit ? h.n : nameClean;
      const fx=String(h.fx||h.prop||'').replace(/\s+/g,' ');
      const ocrTag = ocrHit ? '<span class="cfx" title="'+escapeHtml('原文「'+nameClean+'」系OCR形近错字，已自动纠正为「'+h.n+'」')+'">纠</span>' : '';
      return `<span class="ci has" data-h="${escapeHtml(nameClean)}"><span class="cn">${escapeHtml(showName)}${ocrTag}</span>${dose?`<span class="cd">${escapeHtml(dose)}</span>`:''}<span class="cx">${escapeHtml(fx.length>16?fx.slice(0,16)+'…':fx)}</span></span>`;
    }).join('');
    return `<div class="cing">${cells}</div>`;
  }
  // ===== 单味药详情弹窗（点击组成中的药味） =====
  function herbModalHtml(h){
    const rows=[];
    const badges=(h.tox?'<span class="htox">毒性药</span>':'')+(h.pre===2?'<span class="hpreg">孕妇禁用</span>':h.pre===1?'<span class="hpreg">孕妇慎用</span>':'');
    if(badges) rows.push(['标识',badges]);
    if(h.category) rows.push(['分类',escapeHtml(h.category)]);
    if(h.prop) rows.push(['性味',escapeHtml(h.prop)]);
    if(h.fx) rows.push(['功效',escapeHtml(h.fx)]);
    if((h.sx&&h.sx.length)) rows.push(['症状参考',escapeHtml(h.sx.join('、'))]);
    else if(h.indications) rows.push(['主治',escapeHtml(h.indications)]);
    if(h.use) rows.push(['用法',escapeHtml(h.use)]);
    if(h.note) rows.push(['注意',escapeHtml(h.note)]);
    if(h.origin) rows.push(['基原',escapeHtml(h.origin)]);
    if(h.aliases&&h.aliases.length) rows.push(['别名',escapeHtml(h.aliases.join('、'))]);
    const yb = h.yb || (YB_MAP && YB_MAP[h.n]) || null;
    if(yb) rows.push(['医保', `<span class="yb-pill yb-${yb.payType==='自费'?'zf':(yb.payType==='甲类'?'jia':'yi')}">医保${escapeHtml(yb.payType||'未设')}</span> <span style="font-size:11px;color:#5d7067">${escapeHtml(ybDetailText(yb))}</span>`]);
    return `<div class="hmask" id="hmask"><div class="hmodal">
      <div class="hmh"><span class="hmt">${escapeHtml(h.n)}</span><span class="hmx" title="关闭">✕</span></div>
      <div class="hmb">${rows.map(r=>`<div class="hmr"><span class="hml">${r[0]}</span><span class="hmv">${r[1]}</span></div>`).join('')||'<div style="font-size:11px;color:#93a49a">暂无详细数据</div>'}</div>
    </div></div>`;
  }

  // ===== 诊断要素胶囊（keys）可编辑：点击值 → 行内输入框，回车/失焦保存 =====
  // 保存即整体替换 keys 落库；中医诊断/证型同步 cur.diag/cur.synd（供重析带入），并提示重新分析。
  function editKey(name, el){
    if(!cur||!el) return;
    const k=cur.keys||{};
    const inp=document.createElement('input');
    inp.className='kvedit';
    inp.value=String(k[name]||'');
    inp.maxLength=120;
    inp.style.cssText='border:1px solid var(--amber);border-radius:4px;padding:1px 6px;font-size:12px;outline:none;background:var(--card);color:inherit;width:' + Math.max(90, Math.min(320, (el.textContent||'').length*14+30)) + 'px';
    let done=false;
    const save=async()=>{
      if(done) return; done=true;
      const v=String(inp.value||'').trim();
      if(v===String(k[name]||'')){ renderDetail(); return; }   // 未改动
      const nk=Object.assign({}, k);
      if(v) nk[name]=v; else delete nk[name];                  // 清空=移除该要素
      try{
        const r=await window.qhjf.patchRecord(cur.id,{keys:nk});
        if(r&&r.ok){
          cur=r.rec;
          if(name==='中医诊断') cur.diag=v;   // 同步分析依据（供「返回重选」/重析带入）
          if(name==='证型') cur.synd=v;
          renderDetail(); renderList();
          toast('已更新「'+name+'」'+(isAnalyzed(cur)?' · 点「本地分析」按新诊断重析':''));
        } else { toast('保存失败：'+((r&&r.error)||'未知错误')); renderDetail(); }
      }catch(e){ toast('保存失败：'+e.message); renderDetail(); }
    };
    inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); inp.blur(); } if(ev.key==='Escape'){ done=true; renderDetail(); } });
    inp.addEventListener('blur',save);
    el.replaceWith(inp);
    setTimeout(()=>{ try{ inp.focus(); inp.select(); }catch(e){} },30);
  }

  // ===== 智能方剂分析：审方区（处方+中药+合规核对）=====
  // 审方结论徽章：一栏一结论，医生第一眼先看这里
  function tcmVerdict(t){
    const chosenBad=(t.chosen||[]).some(c=>c.okSynd===false||c.okDiag===false);
    if(chosenBad) return {cls:'bad',icon:'✕',txt:'存在不符 · 建议复核'};
    const riskN=(t.rx&&t.rx.active)?((t.rx.riskN||0)+(t.rx.warnN||0)):0;
    if(t.rx&&t.rx.active&&riskN) return {cls:'warn',icon:'⚠',txt:`合规核查 · ${riskN} 项需关注`};
    if(t.rx&&t.rx.active) return {cls:'ok',icon:'✓',txt:'处方合规通过'};
    if(t.diagCheck) return t.diagCheck.level==='ok' ? {cls:'ok',icon:'✓',txt:'方证相符'}
      : t.diagCheck.level==='partial' ? {cls:'warn',icon:'◐',txt:'基本相符'} : {cls:'bad',icon:'⚠',txt:'对应性弱 · 建议复核'};
    if((t.chosen||[]).some(c=>c.okSynd===true||c.okDiag===true)) return {cls:'ok',icon:'✓',txt:'与辨证相符'};
    return {cls:'idle',icon:'i',txt:'已完成分析'};
  }
  // 一眼清指标条：方证支撑 / 知识库命中 / 合规结论，三个大数字先看清；点击定位到对应区块
  function tcmKbarHtml(t){
    const kb=[];
    if(t.diagCheck){
      const d=t.diagCheck;
      const m={ok:['✓','方证相符','#16674a'],partial:['◐','基本相符','#8f5c0c'],weak:['⚠','对应偏弱','#b3261e']}[d.level]||['·','方证核对','#5d7067'];
      kb.push({v:`${m[0]} ${d.supN||0}/${d.totN||0}`, l:`方证支撑药味 · ${m[1]}`, c:m[2], go:'dchk'});
    }
    if(t.rx&&t.rx.stat&&t.rx.stat.total) kb.push({v:`${t.rx.stat.hit}/${t.rx.stat.total}`, l:'药味命中知识库', c:'#123f28', go:'belong'});
    if(t.rx&&t.rx.active){
      const riskN=(t.rx.riskN||0)+(t.rx.warnN||0);
      kb.push({v:riskN?`${riskN} 项`:'✓ 通过', l:riskN?'合规核查需关注':'处方合规核查', c:riskN?'#8f5c0c':'#16674a', go:'rxs'});

    return `<div class="kbar">${kb.map(k=>{

      return k.go

  // 指标条定位：展开折叠分组 → 平滑滚动 → 闪烁高亮

  function tcmReviewHtml(t){
    if(!t) return '';

    (t.notes||[]).forEach(n=>{ body.push(`<div class="note">${escapeHtml(n)}</div>`); });

    if(t.guess){

      if(t.guessAlt) body.push(`<div style="font-size:10.5px;color:#93a49a;padding:0 14px">另有相近候选：${escapeHtml(t.guessAlt.n)}（供核对）</div>`);

    // 识别中药速览（成方/散药均显示；带剂量；有方剂归属时按「《方名》加减」形式分色：方内绿、加减琥珀）
    if((t.herbs||[]).length){

      let inSet=null;
      if(fsrc){
        inSet=new Set();
        String(fsrc).split(/[、，,;；\n]+/).forEach(tok=>{
          const m=tok.match(/^([^\d（(]+)/);
          if(m){ const nm=m[1].replace(/[（(][^）)]*[)）]/g,'').replace(/各$/,'').trim(); if(nm) inSet.add(nm); }
        });
        if(!inSet.size) inSet=null;
      }
      const isInF = h => inSet && (inSet.has(h) || [...inSet].some(x=>x.includes(h)||h.includes(x)));
      // 显示名映射：速览 chip 与编辑网格保持一致显示炮制品名（醋延胡索/北柴胡/三七粉/酒地龙…）；
      // 方内判定/剂量仍用规范名（t.herbs/herbDoses），知识库关联不受影响

      const QC = (cur && cur.qc && cur.qc.ok !== false) ? cur.qc : null;
      const qcMap = {};

      const pills = t.herbs.map(h=>{

        const badCls = bad ? ' bad' : '';
        const badTip = bad ? `｜待修正：${escapeHtml(bad.issues.map(x=>x.label).join('、'))}` : '';
        const badTag = bad ? `<i>${escapeHtml(bad.issues.map(x=>x.label).join('/'))}</i>` : '';
        if(inSet){

          return `<span class="hchip${badCls}" style="${bad?'':(f?'background:#eef4e4;border-color:#c9e2d3;color:#2f6a45':'background:#fdf8ea;border-color:#f0dcb0;color:#8a6a15')}" title="${f?'《'+(bel&&bel.n||'原方')+'》方内中药（规范名 '+escapeHtml(h)+'）':'加减中药（原方未含，规范名 '+escapeHtml(h)+'）'}${badTip}">${f?'':'加 · '}${escapeHtml(dh)}${dose}${badTag}</span>`;

      const symLine = dc.symTotal
        ? `病历症状 ${dc.symTotal} 项，覆盖 ${dc.symCovered.length} 项${(dc.symMissed||[]).length?`；未覆盖：${escapeHtml(dc.symMissed.join('、'))}（复核是否需对症加减）`:'（全部覆盖）'}`
        : '';

    if(t.rx && t.rx.items && t.rx.items.length){

      // 十八反/十九畏配伍禁忌置顶 + 红色重点样式

      const itHtml=it=>`

          <div class="bd"><div class="a"><span class="lv ${it.level}">${levelLbl(it.level)}</span>${it.tag?`<span class="tag-rx">${escapeHtml(it.tag)}</span>`:''}${escapeHtml(it.title)}</div>

      const bads=rxSorted.filter(it=>it.level==='error'||it.cat==='配伍禁忌');

      const rest=rxSorted.filter(it=>!(it.level==='error'||it.cat==='配伍禁忌'||it.level==='warn'));
